    return { show: show, kana: kana };
  }
  // 持ち時間・パワーのキー数は、おてほんの設定によらずヘボン式で数える（設定で有利・不利が出ないように）
  function keyCount(kana) { return new Romaji.Typer(kana, { style: 'hepburn' }).remainingRoman().length; }

  function setPhase(p) { phase = p; pt = 0; }

  // =========================================================
  //  画面の部品
  // =========================================================
  function dots(n, max, cls) {
    let s = '<span class="dots ' + cls + '">';
    for (let i = 0; i < max; i++) s += '<i class="' + (i < n ? 'on' : '') + '"></i>';
    return s + '</span>';
  }
  function renderBoard() {
    if (!m) return;
    if (m.mode === 'match') {
      const b = m.bases;
      ui.board.innerHTML =
        '<div class="row"><span class="lab">あいて</span><span class="num big">' + m.cpu + '</span></div>' +
        '<div class="row"><span class="lab">きみ</span><span class="num big">' + m.runs + '</span></div>' +
        '<div class="row"><span class="lab">' + m.inning + 'かい うら</span></div>' +
        '<div class="row"><span class="lab">S</span>' + dots(m.strikes, 2, 's') + '</div>' +
        '<div class="row"><span class="lab">O</span>' + dots(Math.min(m.outs, 2), 2, 'o') + '</div>' +
        '<div class="mini"><i class="b2 ' + (b[1] ? 'on' : '') + '"></i><i class="b3 ' + (b[2] ? 'on' : '') + '"></i><i class="b1 ' + (b[0] ? 'on' : '') + '"></i></div>';
    } else {
      ui.board.innerHTML =
        '<div class="row"><span class="lab">ポイント</span><span class="num big">' + m.points + '</span></div>' +
        '<div class="row"><span class="lab">のこり</span><span>' + m.pitchesLeft + ' だせき</span></div>' +
        '<div class="row"><span class="lab">ホームラン</span><span>' + m.homeruns + '</span></div>';
    }
  }

  function renderLine(caption) {
    if (!m || m.mode !== 'match') { ui.linescore.hidden = true; return; }
    let head = '<tr><th></th>', cpu = '<tr><td class="team">あいて</td>', me = '<tr><td class="team">きみ</td>';
    for (let i = 0; i < Match.INNINGS; i++) {
      const now = i === m.inning - 1 ? ' class="now"' : '';
      head += '<th>' + (i + 1) + '</th>';
      cpu += '<td' + now + '>' + (m.line.cpu[i] !== undefined ? m.line.cpu[i] : '') + '</td>';
      me += '<td' + now + '>' + (m.line.me[i] !== undefined ? m.line.me[i] : '') + '</td>';
    }
    head += '<th>けい</th></tr>';
    cpu += '<td class="sum">' + m.cpu + '</td></tr>';
    me += '<td class="sum">' + m.runs + '</td></tr>';
    ui.linescore.innerHTML = '<div class="cap">' + esc(caption) + '</div><table>' + head + cpu + me + '</table>';
    ui.linescore.hidden = false;
  }

  function renderWord() {
    Object.values(keyEls).forEach((k) => k.classList.remove('on'));
    if (!typer) {
      lightFinger(0);
      ui.show.textContent = phase === 'windup' ? 'かまえて…' : phase === 'rushReady' ? 'よーい…' : '';
      ui.kana.innerHTML = '';
      ui.roman.innerHTML = '';
      ui.finger.textContent = '';
      return;
    }
    ui.show.textContent = word.show !== word.kana ? word.show : '';
    const kana = word.kana;
    const done = typer.kanaDone();
    const curLen = typer.done ? 0 : typer.units[typer.index].kana.length;
    ui.kana.innerHTML = '<span class="d">' + esc(kana.slice(0, done)) + '</span>' +
      '<span class="n">' + esc(kana.slice(done, done + curLen)) + '</span>' + esc(kana.slice(done + curLen));
    const typed = typer.typedRoman(), rest = typer.remainingRoman();
    ui.roman.innerHTML = '<span class="d">' + esc(typed) + '</span>' +
      '<span class="n">' + esc(rest.slice(0, 1)) + '</span>' + esc(rest.slice(1));
    // 長い言葉は字を小さくして1行に収める（読める大きさより小さくはしない）
    const room = ui.kana.parentElement.clientWidth || 360;
    ui.kana.style.fontSize = Math.max(24, Math.min(40, Math.floor(room / (kana.length * 1.06)))) + 'px';
    ui.show.style.fontSize = Math.max(16, Math.min(24, Math.floor(room / (word.show.length * 1.06)))) + 'px';
    ui.roman.style.fontSize = Math.max(18, Math.min(26, Math.floor(room / ((typed.length + rest.length) * 0.62)))) + 'px';
    const nk = typer.nextKey();
    if (keyEls[nk]) keyEls[nk].classList.add('on');
    lightFinger(FINGER_OF[nk] || 0, nk);
    ui.finger.innerHTML = FINGER_OF[nk] ? 'つぎは <b>' + esc(nk) + '</b>・' + FINGER_NAME[FINGER_OF[nk]] : '';
  }

  function flashMiss(key) {
    ui.roman.classList.remove('shake');
    void ui.roman.offsetWidth;
    ui.roman.classList.add('shake');
    const k = keyEls[key];
    if (k) { k.classList.add('bad'); setTimeout(() => k.classList.remove('bad'), 180); }
  }

  // 時間・パワーのメーターと目印
  function setupMeters() {
    ui.timebar.querySelectorAll('.tick').forEach((t) => t.remove());
    ui.powerbar.querySelectorAll('.tick').forEach((t) => t.remove());
    ui.ticklabels.innerHTML = '';
    const addTick = (bar, pos, cls, label) => {
      const t = document.createElement('i');
      t.className = 'tick ' + (cls || '');
      t.style.left = pos + '%';
      bar.appendChild(t);
      const s = document.createElement('span');
      s.className = cls || '';
      s.style.left = pos + '%';
      s.textContent = label;
      ui.ticklabels.appendChild(s);
    };
    if (settings.rush) {
      ui.powerMeter.hidden = false;
      const L = Rules.rushLines(settings.level);
      addTick(ui.powerbar, powerPos(L.single) * 100, '', 'ヒット');
      addTick(ui.powerbar, powerPos(L.double) * 100, '', '2るい');
      addTick(ui.powerbar, powerPos(L.triple) * 100, '', '3るい');
      addTick(ui.powerbar, powerPos(L.homerun) * 100, 'hr', 'ホームラン');
    } else {
      ui.powerMeter.hidden = true;
      addTick(ui.timebar, (1 - Rules.hrLine(settings.level)) * 100, 'hr', 'ホームラン');
      addTick(ui.timebar, (1 - Rules.hitLine(settings.level)) * 100, '', 'ヒット');
    }
    setTime(1);
    setPower(0);
    updateMeterState();
  }
  // パワーのメーターの目盛り方。判定の数字は変えず、見せ方だけ：
  // 0〜ヒットを メーターの左 43%、ヒット〜ホームランを 43%〜79% に、同じ間隔で並べる
  // （そのままだと、チャレンジでは目盛りが右に詰まって字が重なる。打ちはじめからメーターが のびて見えるよう2段に分ける）
  function powerPos(p) {
    const L = Rules.rushLines(settings.level), span = L.homerun - L.single;
    if (p <= L.single) return Math.max(0, p / L.single) * 0.43;
    return Math.min(1, 0.43 + (p - L.single) / (span * 1.6) * 0.57);
  }

  // メーターの今のようす：ホームランの線が生きているか、いまのパワーなら何になるか
  // （判定と同じ関数で出すので、表示と結果が食い違わない）
  const RESULT_SHORT = { homerun: 'ホームラン', triple: 'スリーベース', double: 'ツーベース', single: 'ヒット', out: 'アウト', strike: 'みのがし' };
  function updateMeterState() {
    const hrTick = (settings.rush ? ui.powerbar : ui.timebar).querySelector('.tick.hr');
    const hrLab = ui.ticklabels.querySelector('span.hr');
    let hrDead = false, now = '';
    const hrOk = Rules.hrMisses(settings.level);
    if (rush) {
      const k = rushKeysNow();
      setPower(Rules.rushPower(k, rush.misses, settings.level, settings.diff));
      now = k > 0 ? 'いまなら ' + RESULT_SHORT[Rules.judgeRush(k, rush.misses, settings.level, settings.diff)] : '';
    } else if (typer) {
      hrDead = typer.misses > hrOk;
    }
    if (hrTick) hrTick.classList.toggle('dead', hrDead);
    if (hrLab) hrLab.classList.toggle('dead', hrDead);
    ui.meterNote.textContent = settings.rush
      ? 'うった ぶんだけ パワーが たまる・まちがえると へる' + (now ? '　' + now : '')
      : 'ホームランは ' + (hrOk ? 'ミス1かいまでで' : 'ミスなしで') + ' きいろの せんより まえに うつ';
  }
  // れんぞく：うち終えた言葉のキー数＋いま打っている言葉の、打てた かなの ぶん（ヘボン式で数える）
  function rushKeysNow() {
    if (!rush) return 0;
    let k = rush.keys;
    if (typer && word && !typer.done) k += keyCount(word.kana) * typer.kanaDone() / word.kana.length;
    return k;
  }
  function pulsePower() {
    updateMeterState();
    ui.powerbar.classList.remove('pulse');
    void ui.powerbar.offsetWidth;
    ui.powerbar.classList.add('pulse');
  }
  function setTime(left) {
    ui.timefill.style.transform = 'scaleX(' + Math.max(0, left) + ')';
    ui.timefill.classList.toggle('low', left < 0.25);
  }
  function setPower(p) { ui.powerfill.style.transform = 'scaleX(' + powerPos(p) + ')'; }

  function showBanner(text, cls, sub, sub2) {
    ui.banner.hidden = false;
    ui.banner.className = cls || '';
    ui.banner.innerHTML = esc(text) + (sub ? '<span class="sub">' + esc(sub) + '</span>' : '') + (sub2 ? '<span class="sub">' + esc(sub2) + '</span>' : '');
    ui.banner.style.animation = 'none';
    void ui.banner.offsetWidth;
    ui.banner.style.animation = '';
  }
  function hideBanner() { ui.banner.hidden = true; }
  function flash() {
    ui.flash.hidden = false;
    ui.flash.style.animation = 'none';
    void ui.flash.offsetWidth;
    ui.flash.style.animation = '';
    setTimeout(() => { ui.flash.hidden = true; }, 380);
  }

  function setPitchLabel(html) {
    if (!html) { ui.pitchlabel.hidden = true; return; }
    ui.pitchlabel.hidden = false;
    ui.pitchlabel.innerHTML = html;
  }

  // =========================================================
  //  ゲームの流れ
  // =========================================================
  function hideLayers() {
    ui.splash.hidden = true; ui.title.hidden = true; ui.over.hidden = true; ui.rankview.hidden = true; ui.nameentry.hidden = true;
  }

  function startGame() {
    Sound.init();
    Sound.play('start');
    m = Match.newMatch(settings.mode, settings.level, settings.rush, settings.diff);
    Object.assign(stats, { keys: 0, misses: 0, typeTime: 0, missKeys: {}, pa: 0 });
    bag = []; parts = []; lastRank = null; saveFailed = false;
    flight = null; contact = null; applied = null;
    gameNo++;
    hideLayers();
    hideBanner();
    ui.board.hidden = false;
    setupMeters();
    renderBoard();
    if (m.mode === 'match') beginInning(); else startAtBat();
  }

  // 試合：イニングのはじめ（あいての こうげき）
  function beginInning() {
    flight = null; contact = null; applied = null; // 前の打球を、あいての攻撃の画面に残さない
    cpuRuns = Match.startInning(m, Math.random);
    setPhase('cpu');
    renderBoard();
    renderLine(m.inning + 'かい おもて：' + (cpuRuns > 0 ? 'あいてに ' + cpuRuns + 'てん とられた' : 'あいてを 0てんに おさえた！'));
    Sound.play(cpuRuns > 0 ? 'foul' : 'single');
  }

  function startAtBat() {
    typer = null; result = null; reason = ''; applied = null; flight = null; contact = null; rush = null;
    ui.linescore.hidden = true;
    setTime(1); setPower(0);
    updateMeterState(); // 前の打席の「いまなら…」や灰色の線を消す
    setPhase(settings.rush ? 'rushReady' : 'windup');
    setPitchLabel('');
    renderBoard();
    renderWord();
  }

  // ---- 1ことばずつ ----
  function release() {
    word = nextWord();
    typer = new Romaji.Typer(word.kana, { style: settings.style });
    limit = Rules.limitFor(keyCount(word.kana), settings.level, settings.diff);
    pitch = pickPitch();
    pitchTime = 0;
    setPhase('pitch');      // 打っているあいだ、ピッチャーは かまえて待つ（ボールは まだ投げない）
    setPitchLabel('');
    renderWord();
    updateMeterState();
  }

  // 打ち終わった（または時間切れの）あとに、ふつうの速さで投げる
  function deliver() {
    setPhase('delivery');
    const kmh = Math.round(Math.max(60, Math.min(150, 160 - limit * 6 + (pitch.kmh || 0))));
    // ボールが着くまでの時間＝本当の速さで 約17m（ピッチャーの手からホームまで）を飛ぶ時間
    flightTime = Math.max(0.42, Math.min(1.0, 16.9 / (kmh / 3.6)));
    // ストライク（見のがし）は キャッチャーのミットへ、打つ時は バットの芯へ
    pitchTo = result === 'strike' ? [A.MITT[0] + pitch.dx * 0.5, A.MITT[1] + pitch.drop * 0.3] : A.sweetSpot(A.BAT_POS[0], A.BAT_POS[1]);
    setPitchLabel('<b>' + esc(pitch.name) + '</b> ' + kmh + 'km');
  }

  // elapsed = 打ち終わった瞬間の時間（キー入力の時に測ったもの）
  function finishTyping(elapsed) {
    pitchTime = Math.min(limit, elapsed);
    const r = pitchTime / limit;
    missesNow = typer.misses;
    result = Rules.judgeSwing(r, missesNow, settings.level);
    reason = Rules.reasonFor(result, r, missesNow);
    stats.typeTime += pitchTime;
    typer = null;
    renderWord();
    deliver();
  }

  function lookedStrike() {
    result = 'strike';
    reason = 'みのがし';
    stats.typeTime += limit;
    missesNow = typer ? typer.misses : 0;
    typer = null;
    renderWord();
    deliver();
  }

  // ---- れんぞく ----
  function startRush() {
    rush = { time: 0, T: Rules.rushSeconds(settings.level), keys: 0, words: 0, misses: 0, lastTick: 99 };
    pitch = PITCHES[0];
    newRushWord();
    setPhase('rush');
    Sound.play('pitch');
    updateMeterState();
  }
  function newRushWord() {
    word = nextWord();
    typer = new Romaji.Typer(word.kana, { style: settings.style });
    setPitchLabel('れんぞく　<b>' + rush.words + '</b>こ うてた');
    renderWord();
  }
  function endRush() {
    rush.keys = rushKeysNow(); // 打ちかけの言葉も、打てたぶんだけ入れる
    result = Rules.judgeRush(rush.keys, rush.misses, settings.level, settings.diff);
    reason = Rules.rushReason(result, rush.words, rush.misses);
    missesNow = rush.misses;
    stats.typeTime += rush.T;
    typer = null;
    renderWord();
    deliver();
  }

  // 投げたボールの位置（t=0 ピッチャーの手 → t=1 着く）。近づくほど速く大きく見え、球の種類で曲がる
  function ballInPitch(t) { return A.pitchPos(t, pitch || PITCHES[0], pitchTo); }

  function makeFlight(res) {
    const rnd = (a, b) => a + Math.random() * (b - a);
    const side = Math.random() < 0.5 ? -1 : 1;
    let deg, d, peak, dur, kind = 'fly';
    if (res === 'homerun') { deg = rnd(-30, 30); d = 212; peak = 46; dur = 1.8; }
    else if (res === 'triple') { deg = side * rnd(20, 34); d = rnd(152, 166); peak = 26; dur = 1.35; }
    else if (res === 'double') { deg = side * rnd(34, 42); d = rnd(118, 140); peak = 18; dur = 1.2; }
    else if (res === 'single') { deg = [-30, -12, 12, 30][Math.floor(Math.random() * 4)] + rnd(-3, 3); d = rnd(86, 104); peak = 8; dur = 0.95; kind = 'liner'; }
    let chaser = null, land;
    if (res === 'out') {
      const ground = Math.random() < 0.45;
      const pool = ground ? ['1B', '2B', 'SS', '3B'] : ['LF', 'CF', 'RF', 'SS', '2B'];
      chaser = pool[Math.floor(Math.random() * pool.length)];
      const f = A.FIELDERS[chaser];
      land = [f[0] + rnd(-6, 6), f[1] + rnd(-5, 5)];
      kind = ground ? 'grounder' : 'fly';
      peak = ground ? 0 : (chaser === 'SS' || chaser === '2B' ? 30 : 38);
      dur = ground ? 0.8 : 1.5;
    } else {
      land = A.P(deg, d);
      let best = Infinity;
      Object.keys(A.FIELDERS).forEach((k) => {
        if (k === 'P' || k === 'C') return;
        const f = A.FIELDERS[k], dd = Math.hypot(f[0] - land[0], f[1] - land[1]);
        if (dd < best) { best = dd; chaser = k; }
      });
    }
    // 打った方向（0 = センター、- = レフト、+ = ライト）。打席の画面でも この方向へ飛ばす
    deg = Math.atan2(land[0] - A.HOME[0], A.HOME[1] - land[1]) * 180 / Math.PI;
    return { land: land, deg: deg, peak: peak, dur: dur, kind: kind, chaser: chaser, out: res === 'out', homerun: res === 'homerun' };
  }
  // 打席の画面で、当たったボールが向かう先（遠ざかって小さくなる）
  function hitTarget(f) {
    if (!f) return [contact.side < 0 ? 18 : 238, -24];          // ファウル：横の後ろへ
    const x = 128 + f.deg * 2.4;
    if (f.homerun) return [x, 6];
    if (f.kind === 'grounder') return [128 + f.deg * 1.6, 118];
    if (f.kind === 'liner') return [x, 92];
    return [x, 70 - f.peak * 0.8];
  }

  // 結果をきまり（match.js）に反映する。画面のスコアは結果の文字を出す時に書き換える
  function applyResult() {
    stats.pa++;
    applied = Match.apply(m, result, missesNow) || { text: Rules.RESULT_TEXT[result], runs: 0, moves: [], points: 0, inningOver: false, over: true };
  }

  function showResult() {
    renderBoard();
    const t = applied.text;
    const isHit = ['single', 'double', 'triple'].indexOf(result) >= 0;
    let cls = result === 'homerun' ? 'big' : isHit ? 'good' : (result === 'out' || t === 'さんしん') ? 'bad' : '';
    let sub = applied.runs > 0 ? applied.runs + 'てん はいった！' : reason;
    if (applied.sayonara) { cls = 'big'; sub = 'サヨナラ！'; }
    const sub2 = (applied.capped ? '5てん はいったので こうたい　' : '') + (applied.points > 0 ? '+' + applied.points + ' ポイント' : '');
    showBanner(t, cls, sub, sub2);
    if (result === 'homerun') { Sound.play('homerun'); flash(); fireworks(); }
    else if (isHit) { Sound.play('single'); if (applied.runs > 0) Sound.play('cheer'); }
    else if (result === 'out' || t === 'さんしん') Sound.play('out');
    else if (result === 'foul') Sound.play('foul');
    else Sound.play('strike');
    setPhase('banner');
  }

  function afterBanner() {
    hideBanner();
    if (applied.over) { endGame(); return; }
    if (applied.inningOver) {
      setPhase('change');
      renderLine(m.inning - 1 + 'かい おわり　チェンジ');
      Sound.play('change');
      return;
    }
    startAtBat();
  }

  const OVER_TITLE = { win: 'かち！', sayonara: 'サヨナラ かち！', lose: 'まけ…', draw: 'ひきわけ', free: 'おつかれさま！' };

  function endGame() {
    typer = null;
    rush = null;
    renderWord();
    setTime(0);
    setPower(0);
    updateMeterState();
    setPitchLabel('');
    ui.board.hidden = true;
    ui.linescore.hidden = true;
    if (m.end === 'win' || m.end === 'sayonara') Sound.play('win');
    else if (m.end === 'lose') Sound.play('lose');
    else Sound.play('end');
    const all = Ranking.loadAll();
    const list = Ranking.listFor(all, m.mode, m.rush, m.level, m.diff);
    if (Ranking.qualifies(list, m.points)) {
      nameBuf = settings.name;
      nameFresh = !!nameBuf;
      setPhase('name');
      ui.nameRank.textContent = 'スコア ' + m.points;
      renderName();
      ui.nameentry.hidden = false;
      Sound.play('rank');
    } else {
      showOver();
    }
  }

  // 前の人の名前はうすく出しておき、1文字打ったら入れかえる（Enter だけなら そのまま決まる）
  let nameFresh = false;
  function renderName() { ui.nameBox.innerHTML = '<span class="' + (nameFresh ? 'prev' : '') + '">' + esc(nameBuf) + '</span><span class="cur">_</span>'; }

  function saveName() {
    const name = Ranking.cleanName(nameBuf) || 'PLAYER';
    settings.name = name;
    saveSettings();
    const all = Ranking.loadAll();
    const entry = { name: name, score: m.points, acc: accuracy(), time: Date.now() };
    const r = Ranking.insert(Ranking.listFor(all, m.mode, m.rush, m.level, m.diff), entry);
    all[Ranking.keyOf(m.mode, m.rush, m.level, m.diff)] = r.list;
    saveFailed = !Ranking.saveAll(all);
    lastRank = { rank: r.rank, list: r.list, entry: entry };
    ui.nameentry.hidden = true;
    showOver();
  }

  // 切り捨て（ミスが1回でもあれば 100% とは出さない）
  function accuracy() { return stats.keys + stats.misses > 0 ? Math.floor(stats.keys / (stats.keys + stats.misses) * 100) : 0; }

  function rankItems(list, me) {
    if (list.length === 0) return '<li class="empty">まだ きろくが ありません</li>';
    return list.map((e, i) => '<li class="' + (e === me ? 'me' : '') + '"><span class="no">' + (i + 1) + '</span><span>' + esc(e.name) + '</span><span class="sc">' + e.score + '</span></li>').join('');
  }

  function showOver() {
    setPhase('over');
    const acc = accuracy();
    // 実際に打った正しいキーの数 ÷ 打っていた時間（見のがした球の時間もふくむ）
    const kpm = stats.typeTime > 0 ? Math.round(stats.keys / stats.typeTime * 60) : 0;
    // まちがいが多かった順に3つまで
    const weak = Object.entries(stats.missKeys).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([k]) => k).join('・');
    const rows = [['スコア', m.points, 'hl']];
    if (m.mode === 'match') rows.push(['とくてん', 'きみ ' + m.runs + ' - ' + m.cpu + ' あいて']);
    rows.push(['ヒット（ぜんぶ）', m.hits + ' ほん'], ['そのうち ホームラン', m.homeruns + ' ほん'], ['せいかくさ', acc + ' %'],
      ['ただしいキー', '1ぷんに ' + kpm + ' かい'], ['れんしゅうする キー', weak || 'なし！']);
    ui.stats.innerHTML = rows.map((r) => '<dt>' + r[0] + '</dt><dd class="' + (r[2] || '') + '">' + esc(r[1]) + '</dd>').join('');
    ui.overTitle.textContent = OVER_TITLE[m.end] || 'ゲームセット';
    ui.overSub.textContent = playLabel(m.mode, m.rush, m.level, m.diff) + (saveFailed ? '　※この きろくは ほぞん できませんでした' : '');
    const list = lastRank ? lastRank.list : Ranking.listFor(Ranking.loadAll(), m.mode, m.rush, m.level, m.diff);
    ui.overRank.innerHTML = rankItems(list, lastRank && lastRank.entry);
    const first = lastRank && lastRank.rank ? 'ランキング ' + lastRank.rank + 'い！ すごい！' :
      m.homeruns > 0 ? 'ホームランが でたね！ すごい！' :
      acc >= 95 ? 'まちがいが すくない！ せいかくに うてたね' :
      m.hits > 0 ? 'ナイスバッティング！ つぎは ホームランを ねらおう' : 'れんしゅうすると もっと とおくへ とぶよ';
    // レベルが合っていない時のひとこと（ほとんど打てない／ホームランばかり）
    const li = Rules.LEVEL_KEYS.indexOf(m.level), pa = Math.max(1, stats.pa);
    const hint = m.hits / pa < 0.2 && li > 0 ? 'むずかしかったら レベルを ひとつ さげて みよう' :
      m.homeruns / pa >= 0.4 && li < Rules.LEVEL_KEYS.length - 1 ? 'つぎは レベルを ひとつ あげて みよう！' : '';
    ui.praise.textContent = first + (hint ? '　' + hint : '');
    ui.over.hidden = false;
  }

  function playLabel(mode, rushOn, level, diff) {
    return MENU[0].opts.find((o) => o[0] === mode)[1] + '・' + MENU[1].opts.find((o) => o[0] === rushOn)[1] + '・' + Rules.LEVELS[level].label + '・' + Rules.DIFFS[Rules.diffOf(diff)].label;
  }

  function showRanking() {
    setPhase('rank');
    ui.rankTitle.textContent = playLabel(settings.mode, settings.rush, settings.level, settings.diff);
    ui.rankList.innerHTML = rankItems(Ranking.listFor(Ranking.loadAll(), settings.mode, settings.rush, settings.level, settings.diff), null);
    ui.title.hidden = true;
    ui.rankview.hidden = false;
  }

  // ---- 音のオン・オフ（左下の印。押しても M キーでも切りかわる。えらんだ状態は覚えておく） ----
  const soundBtn = $('soundBtn');
  const SPEAKER = '<path d="M3 9h4l5-4v14l-5-4H3z" fill="currentColor"/>';
  function renderSoundBtn() {
    const on = Sound.on;
    soundBtn.classList.toggle('off', !on);
    soundBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
    soundBtn.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true">' + SPEAKER +
      (on ? '<path class="on" d="M15 9.5c1.2 1.4 1.2 3.6 0 5M17.5 7c2.6 2.8 2.6 7.2 0 10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>'
          : '<path class="on" d="M15 9l6 6M21 9l-6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>') +
      '</svg><span>おと <span class="on">' + (on ? 'オン' : 'オフ') + '</span></span>';
  }
  function toggleSound() {
    Sound.on = !Sound.on;
    settings.sound = Sound.on;
    saveSettings();
    if (!Sound.on) { try { if (window.speechSynthesis) window.speechSynthesis.cancel(); } catch (e) { /* なし */ } }
    renderSoundBtn();
    if (Sound.on) { Sound.init(); Sound.play('key'); }
  }
  // 画面のクリック（スタート・とばす）より先に受け取って、そちらには伝えない
  soundBtn.addEventListener('pointerdown', (e) => { e.stopPropagation(); });
  soundBtn.addEventListener('click', (e) => { e.stopPropagation(); toggleSound(); soundBtn.blur(); });
  Sound.on = settings.sound;
  renderSoundBtn();

  // ---- 画面のボタン（キーボードは ことばを打つ時だけ。ほかの操作は ボタンで できる） ----
  // 押した時は 画面のクリック（スタート・とばす）に伝えない。押したあとは ボタンから はなれる（スペースキーで二度押しにならないように）
  function onButton(id, fn) {
    const b = $(id);
    b.addEventListener('pointerdown', (e) => { e.stopPropagation(); });
    b.addEventListener('click', (e) => { e.stopPropagation(); Sound.init(); fn(); b.blur(); });
  }
  onButton('splashBtn', () => startOpening());
  onButton('playBtn', () => startGame());
  onButton('rankBtn', () => showRanking());
  onButton('openingBtn', () => startOpening());
  onButton('rankBackBtn', () => toTitle());
  onButton('nameOkBtn', () => saveName());
  onButton('nameDelBtn', () => { nameBuf = nameFresh ? '' : nameBuf.slice(0, -1); nameFresh = false; renderName(); });
  onButton('nameCancelBtn', () => toTitle());
  onButton('againBtn', () => startGame());
  onButton('overTitleBtn', () => toTitle());
  onButton('skipBtn', () => { if (phase === 'opening') { movie.skip(); endOpening(); } else skip(); });
  onButton('quitBtn', () => toTitle());
  const skipBtn = $('skipBtn'), quitBtn = $('quitBtn');
  const SKIPPABLE = ['opening', 'cpu', 'change', 'banner', 'foulfly', 'caught', 'flight'];
  const OUT_OF_GAME = ['splash', 'title', 'rank', 'over', 'name', 'opening'];
  // 「とばす」は演出の時だけ、「タイトルへ」はゲームの最中だけ 出す
  function renderCtrl() {
    const sk = SKIPPABLE.indexOf(phase) < 0, qt = OUT_OF_GAME.indexOf(phase) >= 0;
    if (skipBtn.hidden !== sk) skipBtn.hidden = sk;
    if (quitBtn.hidden !== qt) quitBtn.hidden = qt;
  }

  // ---- オープニング（opening.js は Codex が作った。11.5秒・音と声つき・どのキーでも とばせる） ----
  let movie = null;
  function startOpening() {
    Sound.init();
    if (movie) movie.skip();
    hideLayers();
    ui.board.hidden = true;
    movie = Opening.create(main);
    setPhase('opening');
  }
  function endOpening() {
    A.use(main);
    toTitle();
  }
  // スタートの画面はクリックでも進む。オープニングもクリックで とばせる
  $('screen').addEventListener('pointerdown', () => {
    if (phase === 'splash') startOpening();
    else if (phase === 'opening') { movie.skip(); endOpening(); }
  });
  // 声の一覧は読みこみに時間がかかるブラウザがあるので、先に呼んでおく
  try { if (window.speechSynthesis) window.speechSynthesis.getVoices(); } catch (e) { /* 声が無くても遊べる */ }

  function toTitle() {
    setPhase('title');
    gameNo++;
    m = null; typer = null; rush = null; flight = null; contact = null; applied = null; parts = [];
    hideBanner();
    hideLayers();
    ui.board.hidden = true;
    ui.linescore.hidden = true;
    setPitchLabel('');
    ui.title.hidden = false;
    renderMenu();
    renderWord();
  }

  // ---- 花火・火花 ----
  function burst(x, y, n, colors, speed, life) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, v = speed * (0.4 + Math.random() * 0.6);
      parts.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, age: 0, life: life * (0.7 + Math.random() * 0.5), s: Math.random() < 0.3 ? 2 : 1, c: colors[Math.floor(Math.random() * colors.length)] });
    }
  }
  function fireworks() {
    const sets = [['#f2c94c', '#fff4c2', '#ffffff'], ['#e06b62', '#f4b4a8', '#ffffff'], ['#7fd1a8', '#c8f0dc', '#ffffff'], ['#6a8fc9', '#c3d4f2', '#ffffff']];
    const no = gameNo;
    for (let i = 0; i < 4; i++) {
      setTimeout(() => { if (no === gameNo && phase !== 'title') burst(40 + Math.random() * 176, 18 + Math.random() * 50, 34, sets[i % sets.length], 46, 0.9); }, i * 260);
    }
  }
  function updateParts(dt) {
    parts.forEach((p) => { p.age += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 30 * dt; });
    parts = parts.filter((p) => p.age < p.life);
  }

  // =========================================================
  //  1コマごとの進行
  // =========================================================
  // dt = 動きに使う時間（コマ落ちしても動きが飛ばないよう短く切る）
  // realDt = 本当に過ぎた時間（持ち時間・れんぞくの時間はこちらで測る）
  // delivery = 投げる動き（足を上げて ふみ出し、腕をふる MOTION 秒）＋ ボールが着くまで（flightTime 秒・球の速さで決まる）
  const PHASE_LEN = { cpu: 2.2, change: 1.3, banner: 1.15, foulfly: 0.5, caught: 0.3, windup: 0.5, rushReady: 0.8, swing: 0.4 };
  const MOTION = 0.62, SWING_TIME = 0.15, FOLLOW = 0.35;
  // 投げてからのボールの進み具合（0〜1。1 でミットか バットの芯に着く）
  function deliveryT() { return clamp01((pt - MOTION) / flightTime); }
  // ピッチャーの動き（0〜1）。足はゆっくり上げ、腕は すばやく ふる
  function pitcherU() {
    if (phase === 'delivery' && pt < MOTION) {
      const s = pt / MOTION;
      const map = [[0, 0], [0.5, 0.3], [0.72, 0.48], [0.9, 0.62], [1, A.RELEASE_AT]];
      for (let i = 1; i < map.length; i++) if (s <= map[i][0]) return lerp(map[i - 1][1], map[i][1], (s - map[i - 1][0]) / (map[i][0] - map[i - 1][0]));
    }
    if (phase === 'delivery') return A.RELEASE_AT + (1 - A.RELEASE_AT) * clamp01((pt - MOTION) / FOLLOW);
    if (['swing', 'foulfly', 'caught'].indexOf(phase) >= 0 || (phase === 'banner' && result === 'strike')) return 1;
    return 0;
  }
  // バッターの動き（0〜1）。ピッチャーが足を上げたら 自分も足を上げ、投げたら ふみ出して待ち、
  // ボールが来る 0.15秒前に振りはじめて、バットの芯（A.SWING_CONTACT）で ちょうど当たる
  function batterU() {
    if (phase === 'delivery') {
      const hitAt = MOTION + flightTime;
      let u = 0;
      if (pt > 0.12) u = 0.25 * clamp01((pt - 0.12) / 0.33);
      if (pt > 0.45) u = 0.25 + 0.2 * clamp01((pt - 0.45) / Math.max(0.05, Math.min(MOTION + 0.1, hitAt - SWING_TIME) - 0.45));
      if (result !== 'strike' && pt > hitAt - SWING_TIME) {
        const s = clamp01((pt - (hitAt - SWING_TIME)) / SWING_TIME);
        u = 0.45 + (A.SWING_CONTACT - 0.45) * s * s;              // 加速しながら振る
      }
      return u;
    }
    if (phase === 'swing') return A.SWING_CONTACT + (1 - A.SWING_CONTACT) * (1 - Math.pow(1 - clamp01(pt / FOLLOW), 2));
    if (phase === 'foulfly') return 1;
    if (phase === 'caught' || (phase === 'banner' && result === 'strike')) return 0.45;
    return 0;
  }
  function update(dt, realDt) {
    pt += dt;
    updateParts(dt);
    switch (phase) {
      case 'cpu':
        if (pt >= PHASE_LEN.cpu) { ui.linescore.hidden = true; if (m.over) endGame(); else startAtBat(); }
        break;
      case 'change':
        if (pt >= PHASE_LEN.change) { ui.linescore.hidden = true; beginInning(); }
        break;
      case 'windup':
        if (pt >= PHASE_LEN.windup) release();
        break;
      case 'rushReady':
        if (pt >= PHASE_LEN.rushReady) startRush();
        break;
      case 'pitch': {
        pitchTime += realDt;
        setTime(1 - pitchTime / limit);
        if (pitchTime >= limit) lookedStrike();
        break;
      }
      case 'rush': {
        rush.time += realDt;
        const left = rush.T - rush.time;
        setTime(left / rush.T);
        const sec = Math.ceil(left);
        if (sec <= 3 && sec < rush.lastTick && sec > 0) { rush.lastTick = sec; Sound.play('tick'); }
        if (left <= 0) endRush();
        break;
      }
      case 'delivery':
        if (pt >= MOTION && !contact) { contact = { pitched: true }; Sound.play('pitch'); } // 手をはなした音
        if (pt >= MOTION + flightTime) {
          if (result === 'strike') { Sound.play('catch'); setPhase('caught'); }
          else {
            // バットの芯に当たった。打球の行き先は ここで決めて、打席の画面でも その方向へ飛ばす
            const at = ballInPitch(1);
            contact = { x: at.x, y: at.y, r: at.r, side: Math.random() < 0.5 ? -1 : 1 };
            flight = result === 'foul' ? null : makeFlight(result);
            Sound.play('hit');
            burst(at.x, at.y, 10, ['#ffffff', '#fff4c2', '#f2c94c'], 40, 0.25);
            setPhase('swing');
          }
        }
        break;
      case 'swing':
        if (pt >= PHASE_LEN.swing) {
          applyResult();
          if (result === 'foul') setPhase('foulfly');
          else setPhase('flight');
        }
        break;
      case 'foulfly':
        if (pt >= PHASE_LEN.foulfly) showResult();
        break;
      case 'caught':
        if (pt >= PHASE_LEN.caught) { applyResult(); showResult(); }
        break;
      case 'flight':
        if (pt >= flight.dur + (flight.out ? 0.1 : 0.25)) showResult();
        break;
      case 'banner':
        if (pt >= PHASE_LEN.banner) afterBanner();
        break;
    }
  }

  // スペースキーで演出をとばす
  function skip() {
    if (phase === 'flight') pt = flight.dur + 1;
    else if (PHASE_LEN[phase] !== undefined && ['cpu', 'change', 'banner', 'foulfly', 'caught'].indexOf(phase) >= 0) pt = PHASE_LEN[phase];
  }

  // =========================================================
  //  描く
  // =========================================================
  function drawBatting() {
    main.drawImage(BG_BAT, 0, 0, W, H);
    A.pitcher(pitcherU());
    const stance = ['pitch', 'windup', 'rush', 'rushReady'].indexOf(phase) >= 0;
    A.batter(A.BAT_POS[0], A.BAT_POS[1], batterU(), stance ? performance.now() / 1000 : 0);

    let ball = null;
    if (phase === 'delivery' && pt >= MOTION) ball = ballInPitch(deliveryT());
    if (phase === 'caught' || (phase === 'banner' && result === 'strike')) ball = ballInPitch(1);
    if (phase === 'swing') {
      // 当たった所から、打球の方向へ（遠ざかって小さくなる）。ゴロは はずみながら
      const t = clamp01(pt / PHASE_LEN.swing);
      ball = A.hitPos(t, [contact.x, contact.y], hitTarget(flight));
      if (flight && flight.kind === 'grounder') ball.y -= Math.abs(Math.sin(t * Math.PI * 2.5)) * 4 * (1 - t);
    }
    // 影と、ボールの通ったあと
    if (ball && phase === 'delivery') {
      A.ellipse(ball.sx, ball.sy, 0.5 + ball.r * 0.6, 0.5 + ball.r * 0.2, C.shadow);
      // 通ったあとの 光の筋（近づくほど長く見える）
      const tNow = deliveryT(), tail = ballInPitch(Math.max(0, tNow - 0.08));
      main.globalAlpha = 0.45;
      A.line(tail.x, tail.y, ball.x, ball.y, C.light, ball.r > 1.5 ? 1 : 0.5);
      main.globalAlpha = 1;
    }
    // 見のがしの球は、キャッチャーが 来る所へ ミットを動かして とる
    const catchIt = result === 'strike' && pitchTo && (phase === 'delivery' || phase === 'caught' || phase === 'banner');
    A.catcher(catchIt ? mix2(A.MITT, pitchTo, phase === 'delivery' ? clamp01(deliveryT() * 1.4) : 1) : A.MITT);
    if (ball) A.ball(ball.x, ball.y, ball.r);
    A.particles(parts);
  }

  function drawField() {
    main.drawImage(BG_FIELD, 0, 0, W, H);
    // 結果の文字が出ている間は、打球が止まった形のまま
    const T = flight && phase === 'flight' ? clamp01(pt / flight.dur) : 1;
    const step = Math.floor(performance.now() / 130) % 2;
    Object.keys(A.FIELDERS).forEach((k) => {
      let [x, y] = A.FIELDERS[k];
      let st, gl = x >= 128 ? -1 : 1, back = false;
      if (flight && k === flight.chaser) {
        // 追いかける先はフェンスの手前まで（ボールはスタンドへ飛んでも、人はフェンスを越えない）
        const dx = flight.land[0] - A.HOME[0], dy = flight.land[1] - A.HOME[1];
        const q = Math.min(1, (A.FENCE - 8) / Math.hypot(dx, dy));
        const tx = A.HOME[0] + dx * q, ty = A.HOME[1] + dy * q;
        const reach = flight.out ? T : Math.min(T * 0.55, 0.85);
        x = lerp(x, tx, reach); y = lerp(y, ty, reach);
        if (T < 1) st = step;
        gl = tx >= x ? 1 : -1; // グラブをボールの方へ
        back = ty < y - 2;     // 外野の方へ追う時は後ろすがた
      }
      A.mini(x, y, 'field', st, gl, back);
    });
    // 走る人
    const moves = phase === 'flight' && applied ? applied.moves : [];
    if (moves.length) {
      moves.forEach(([from, to]) => {
        const p = lerp(from, to, clamp01(T * 1.1));
        // ホーム→1るい→2るい は上へ走るので後ろすがた
        A.mini(...basePoint(p), 'bat', p < to ? step : undefined, undefined, p < to && Math.floor(p) % 4 < 2);
      });
    } else if (m) {
      m.bases.forEach((on, i) => { if (on) A.mini(...A.BASES[i + 1], 'bat'); });
    }
    // ボール
    if (flight) {
      const t = T;
      // 横の進み：ゴロは 地面にこすれて だんだん遅く、フライは 空気でわずかに遅くなる
      const s = flight.kind === 'grounder' ? easeOut(t) : (1 - Math.exp(-0.9 * t)) / (1 - Math.exp(-0.9));
      const gx = lerp(A.HOME[0], flight.land[0], s), gy = lerp(A.HOME[1], flight.land[1], s);
      let h;
      if (flight.homerun) h = flight.peak * 4 * t * (1 - t) + 6 * t;
      else h = flight.kind === 'grounder' ? Math.abs(Math.sin(t * Math.PI * 3)) * 4 * (1 - t) : flight.peak * 4 * t * (1 - t);
      if (!(flight.homerun && t >= 1)) {
        A.ellipse(gx, gy, 2, 1, C.shadow);
        A.ball(gx, gy - h, 1 + h / 22);
      }
    }
    A.particles(parts);
  }
  function basePoint(p) {
    const i = Math.min(3, Math.floor(p)), f = p - i;
    const a = A.BASES[i], b = A.BASES[i + 1];
    return [lerp(a[0], b[0], f), lerp(a[1], b[1], f)];
  }

  function draw() {
    renderCtrl();
    if (phase === 'opening') { movie.draw(); return; }
    const fieldView = phase === 'flight' || phase === 'cpu' || phase === 'change' || (phase === 'banner' && flight);
    ui.board.classList.toggle('low', !!fieldView);
    ui.pitchlabel.classList.toggle('away', !!fieldView);
    if (fieldView) drawField(); else drawBatting();
  }

  // =========================================================
  //  キー入力
  // =========================================================
  function typeKey(e) {
    if (e.ctrlKey || e.altKey || e.metaKey) return;
    if (e.key === ' ') { e.preventDefault(); return; }
    if (e.key.length !== 1) return;
    e.preventDefault();
    // 時計はコマごとにしか進まないので、前のコマから今までの時間も足して「今」の時間で判定する
    const extra = sinceFrame();
    if (phase === 'pitch' && pitchTime + extra >= limit) { lookedStrike(); return; }
    if (phase === 'rush' && rush.time + extra >= rush.T) { endRush(); return; }
    const elapsedNow = phase === 'pitch' ? pitchTime + extra : 0;
    const expected = typer.nextKey();
    const r = typer.input(e.key);
    if (r === 'miss') {
      stats.misses++;
      stats.missKeys[expected] = (stats.missKeys[expected] || 0) + 1;
      if (rush) rush.misses++;
      Sound.play('miss');
      flashMiss(e.key.toLowerCase());
    } else if (r === 'ok' || r === 'complete') {
      stats.keys++;
      Sound.play('key');
    }
    renderWord();
    if (r === 'complete') {
      if (phase === 'pitch') finishTyping(elapsedNow);
      else if (phase === 'rush') {
        rush.keys += keyCount(word.kana);
        rush.words++;
        Sound.play('word');
        pulsePower();
        newRushWord();
      }
    }
    if (r === 'miss' || rush) updateMeterState();
  }

  window.addEventListener('keydown', (e) => {
    Sound.init();
    const k = e.key;
    if (e.repeat) { if (k === ' ') e.preventDefault(); return; } // 長押しは1回だけ数える
    // スタートの画面：どのキーでもオープニングへ／オープニング中：どのキーでも とばす
    if (phase === 'splash') { if (k.length === 1 || k === 'Enter') { e.preventDefault(); startOpening(); } return; }
    if (phase === 'opening') { e.preventDefault(); movie.skip(); endOpening(); return; }
    if (k === 'Escape') { toTitle(); return; }
    if (phase === 'name') {
      e.preventDefault();
      if (k === 'Enter') saveName();
      else if (k === 'Backspace') { nameBuf = nameFresh ? '' : nameBuf.slice(0, -1); nameFresh = false; renderName(); }
      else if (/^[a-zA-Z0-9]$/.test(k)) {
        if (nameFresh) { nameBuf = ''; nameFresh = false; }
        if (nameBuf.length < 8) { nameBuf += k.toUpperCase(); Sound.play('key'); }
        renderName();
      }
      return;
    }
    if (phase === 'title') {
      if (k === 'ArrowUp') { menuSel = (menuSel + MENU.length - 1) % MENU.length; renderMenu(); }
      else if (k === 'ArrowDown') { menuSel = (menuSel + 1) % MENU.length; renderMenu(); }
      else if (k === 'ArrowLeft') stepMenu(-1);
      else if (k === 'ArrowRight') stepMenu(1);
      else if (k === ' ' || k === 'Enter') { e.preventDefault(); startGame(); }
      else if (k === 'r' || k === 'R') showRanking();
      else if (k === 'o' || k === 'O') startOpening();
      else if (k === 'm' || k === 'M') toggleSound();
      if (k.indexOf('Arrow') === 0) e.preventDefault();
      return;
    }
    if (phase === 'rank') {
      if (k === ' ' || k === 'Enter' || k === 'r' || k === 'R') { e.preventDefault(); toTitle(); }
      return;
    }
    if (phase === 'over') {
      if (k === ' ' || k === 'Enter') { e.preventDefault(); startGame(); }
      return;
    }
    if (phase === 'pitch' || phase === 'rush') { typeKey(e); return; }
    if (k === ' ' || k === 'Enter') { e.preventDefault(); skip(); return; }
    if (k === 'm' || k === 'M') toggleSound();
  });

  // ---- 大きさ合わせ ----
  // 縦にならべる（野球の画面の下に打つ欄）か、横にならべる（右に打つ欄）か、大きく映せる方をえらぶ
  // 打つ欄は いつも「言葉が上・キーボードと手が下」。横に余裕があれば、野球の画面の右に置く
  const SIDE_PANEL = 500;
  function fit() {
    const iw = window.innerWidth, ih = window.innerHeight;
    const PANEL_H = 580;                                 // 下にならべた時の打つ欄の高さ（目安。手の絵のぶん高い）
    let sV = 1;
    for (let s = 4; s >= 2; s--) if ((iw - 32) / W >= s && (ih - PANEL_H - 64) / H >= s) { sV = s; break; }
    const sS = Math.floor(Math.min((iw - 32 - SIDE_PANEL - 16) / W, (ih - 64) / H));
    const side = sS >= 2 && sS >= sV;
    const s = Math.max(2, Math.min(4, side ? sS : sV));
    document.documentElement.style.setProperty('--s', s);
    $('app').classList.toggle('side', side);
    ui.panel.classList.add('stack');
  }
  window.addEventListener('resize', fit);

  // ---- 回す ----
  let last = performance.now();
  let debugSpeed = 1; // 動作確認でゆっくり動かす時だけ変える
  // 前のコマから今までの本当の時間（キー入力の判定に使う）
  function sinceFrame() { return Math.min(2, (performance.now() - last) / 1000) * debugSpeed; }
  // 別のタブに移っている間は時計を止める（もどった時に、その間の時間を入れない）
  document.addEventListener('visibilitychange', () => { last = performance.now(); });
  function frame(now) {
    const raw = (now - last) / 1000;
    last = now;
    const dt = Math.min(0.05, raw) * debugSpeed;   // 動き：コマ落ちしても飛ばないよう短く切る
    const realDt = Math.min(2, raw) * debugSpeed;  // 持ち時間：本当に過ぎた時間（重い時も切り捨てない）
    if (phase === 'opening') { movie.update(realDt); if (movie.done) endOpening(); }
    else if (['splash', 'title', 'rank', 'over', 'name'].indexOf(phase) < 0) update(dt, realDt);
    else updateParts(dt);
    draw();
    requestAnimationFrame(frame);
  }

  fit();
  setupMeters();
  renderMenu();
  renderWord();
  requestAnimationFrame(frame);

  // 動作確認用（ブラウザのコンソールから中を見られるように）
  window.__ts = {
    get phase() { return phase; }, get m() { return m; }, get typer() { return typer; }, get rush() { return rush; },
    get pitchTime() { return pitchTime; }, get limit() { return limit; }, get result() { return result; },
    stats: stats, settings: settings,
    set speed(v) { debugSpeed = v; },
    // 時計を sec 秒ぶん進めて描く（画面が後ろに回って描画が止まっている時の確認用）
    step(sec) {
      const n = Math.round(sec * 60);
      for (let i = 0; i < n; i++) {
        if (phase === 'opening') { movie.update(1 / 60); if (movie.done) endOpening(); }
        else if (['splash', 'title', 'rank', 'over', 'name'].indexOf(phase) < 0) update(1 / 60, 1 / 60);
      }
      draw();
      return phase;
    },
  };
})();

</script>
</body>
</html>
