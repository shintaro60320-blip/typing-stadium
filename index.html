<!doctype html>
<html lang="ja">
<head>
<!-- タイピングスタジアム / build 2026-11-01 00:30 -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>タイピングスタジアム</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
:root {
  --s: 3;                    /* 画面の拡大率（game.js が決める） */
  --bg: #0e1220;
  --panel: #161c30;
  --panel-2: #1f2742;
  --ink: #f4f1e8;
  --ink-dim: #9aa3bd;
  --ink-soft: #b8bfd4;       /* 野球の画面の上に重ねる薄い字（明るい土の上でも読める濃さ） */
  --done: #7fd1a8;           /* 打ち終わった字・よい結果 */
  --next: #f2c94c;           /* 次に打つ字・いちばん大事な数字 */
  --miss: #e05a5a;
  --line: #2b3454;
  --font: "DotGothic16", "MS Gothic", "Osaka-Mono", monospace;
  /* 指の色（キーボードの下のふち）。目立ちすぎないよう明るさをそろえる */
  --f1: #c97a8a; --f2: #c9a36a; --f3: #8fb56d; --f4: #6aa8c9;
  --f5: #6a8fc9; --f6: #9a7ac9; --f7: #c97ab0; --f8: #b5b56d;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }

html, body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
}

#app {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  padding: 16px;
}

#screen {
  position: relative;
  width: calc(256px * var(--s));
  height: calc(224px * var(--s));
  overflow: hidden;
  border-radius: 8px;
  box-shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .35);
}

#cv {
  width: 100%;
  height: 100%;
  display: block;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
}

/* ---- スコアボード ---- */
#board {
  position: absolute;
  top: calc(6px * var(--s));
  right: calc(6px * var(--s));
  background: rgba(14, 18, 32, .85);
  padding: calc(4px * var(--s)) calc(6px * var(--s));
  border-radius: calc(2px * var(--s));
  font-size: calc(7px * var(--s));
  line-height: 1.4;
  min-width: calc(62px * var(--s));
}
#board.low { top: auto; bottom: calc(6px * var(--s)); min-width: 0; }
/* 球場の画面では点数だけにして、打球を隠さない */
#board.low .row:nth-child(n+3), #board.low .mini { display: none; }
#pitchlabel.away { display: none; }

/* ---- ボタン（ゲームの外の操作は ぜんぶボタンで できる） ---- */
.gbtn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: calc(2px * var(--s));
  font: inherit;
  font-size: calc(7px * var(--s));
  color: var(--ink);
  background: rgba(31, 39, 66, .92);
  border: 0;
  border-radius: calc(2px * var(--s));
  padding: calc(2px * var(--s)) calc(5px * var(--s));
  cursor: pointer;
  transition: background .12s cubic-bezier(.2, .8, .3, 1);
}
.gbtn:hover { background: #2b3561; }
.gbtn.primary { background: var(--next); color: #1a1a2e; }
.gbtn.primary:hover { background: #f6d777; }
.gbtn.big { font-size: calc(10px * var(--s)); padding: calc(3px * var(--s)) calc(10px * var(--s)); }
.btnrow { display: flex; gap: calc(5px * var(--s)); justify-content: center; margin-top: calc(3px * var(--s)); }
.btnrow.mid { align-items: center; }

/* 左下：音・とばす・タイトルへ（どの画面でも見える） */
#ctrl {
  position: absolute;
  left: calc(6px * var(--s));
  bottom: calc(6px * var(--s));
  z-index: 5;
  display: flex;
  gap: calc(3px * var(--s));
}
#ctrl .gbtn { background: rgba(14, 18, 32, .85); }
#ctrl .gbtn:hover { background: #2b3561; }
#soundBtn svg { width: calc(9px * var(--s)); height: calc(9px * var(--s)); display: block; }
#soundBtn .on { color: var(--next); }
#soundBtn.off { color: var(--ink-soft); }
#soundBtn.off .on { color: var(--miss); }
#board .row { display: flex; justify-content: space-between; align-items: center; gap: calc(6px * var(--s)); }
#board .lab { color: var(--ink-dim); }
#board .num { color: var(--next); font-variant-numeric: tabular-nums; }
#board .big { font-size: calc(9px * var(--s)); }
.dots i {
  display: inline-block;
  width: calc(5px * var(--s)); height: calc(5px * var(--s));
  margin-left: calc(2px * var(--s));
  border-radius: 50%;
  background: var(--line);
}
.dots.s i.on { background: var(--next); }
.dots.o i.on { background: var(--miss); }
.mini { position: relative; height: calc(16px * var(--s)); margin-top: calc(2px * var(--s)); }
.mini i {
  position: absolute;
  width: calc(6px * var(--s)); height: calc(6px * var(--s));
  background: var(--line);
  transform: rotate(45deg);
}
.mini i.on { background: var(--next); }
.mini .b1 { right: calc(12px * var(--s)); top: calc(7px * var(--s)); }
.mini .b2 { right: calc(23px * var(--s)); top: calc(1px * var(--s)); }
.mini .b3 { right: calc(34px * var(--s)); top: calc(7px * var(--s)); }

#pitchlabel {
  position: absolute;
  top: calc(6px * var(--s));
  left: calc(6px * var(--s));
  background: rgba(14, 18, 32, .85);
  padding: calc(2px * var(--s)) calc(5px * var(--s));
  border-radius: calc(2px * var(--s));
  font-size: calc(7px * var(--s));
}
#pitchlabel b { color: var(--next); font-weight: 400; }

/* ---- イニングごとの点（ラインスコア） ---- */
#linescore {
  position: absolute;
  left: 50%;
  top: calc(16px * var(--s));
  transform: translateX(-50%);
  background: rgba(14, 18, 32, .9);
  border-radius: calc(3px * var(--s));
  padding: calc(5px * var(--s)) calc(8px * var(--s));
  font-size: calc(8px * var(--s));
  text-align: center;
}
#linescore .cap { color: var(--next); margin-bottom: calc(3px * var(--s)); }
#linescore table { border-collapse: collapse; margin: 0 auto; }
#linescore td, #linescore th { padding: calc(1px * var(--s)) calc(4px * var(--s)); font-weight: 400; font-variant-numeric: tabular-nums; }
#linescore th { color: var(--ink-dim); }
#linescore td.team { text-align: left; color: var(--ink-dim); }
#linescore td.sum { color: var(--next); }
#linescore td.now { background: rgba(242, 201, 76, .14); }

/* ---- 結果の文字 ---- */
#banner {
  position: absolute;
  left: 0; right: 0;
  top: 34%;
  padding: calc(6px * var(--s)) 0;
  background: linear-gradient(90deg, rgba(14, 18, 32, 0), rgba(14, 18, 32, .72) 20%, rgba(14, 18, 32, .72) 80%, rgba(14, 18, 32, 0));
  text-align: center;
  font-size: calc(24px * var(--s));
  letter-spacing: .04em;
  color: var(--ink);
  text-shadow:
    0 calc(1px * var(--s)) 0 #1a1a2e, calc(1px * var(--s)) 0 0 #1a1a2e,
    0 calc(-1px * var(--s)) 0 #1a1a2e, calc(-1px * var(--s)) 0 0 #1a1a2e,
    0 calc(3px * var(--s)) 0 rgba(0, 0, 0, .35);
  animation: pop .32s cubic-bezier(.2, .9, .3, 1.3);
}
#banner.big { color: var(--next); font-size: calc(30px * var(--s)); }
#banner.good { color: var(--done); }
#banner.bad { color: #f4b4a8; }
#banner .sub { display: block; font-size: calc(9px * var(--s)); margin-top: calc(4px * var(--s)); color: var(--ink); }
@keyframes pop {
  from { transform: scale(.6); opacity: 0; }
  to   { transform: scale(1); opacity: 1; }
}
#flash { position: absolute; inset: 0; background: #fff4c2; animation: flash .35s ease-out forwards; pointer-events: none; }
@keyframes flash { from { opacity: .7; } to { opacity: 0; } }

/* ---- タイトル・ランキング・ゲームセット ---- */
.layer {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  background: linear-gradient(rgba(14, 18, 32, .62), rgba(14, 18, 32, .9));
  gap: calc(5px * var(--s));
  padding: calc(8px * var(--s));
}
.layer.dark { background: rgba(14, 18, 32, .92); }
.layer h1 {
  margin: 0;
  font-weight: 400;
  font-size: calc(19px * var(--s));
  line-height: 1.15;
  white-space: nowrap;
  letter-spacing: .06em;
  color: var(--next);
  text-shadow: 0 calc(2px * var(--s)) 0 #1a1a2e;
}
.layer h2 {
  margin: 0;
  font-weight: 400;
  font-size: calc(20px * var(--s));
  color: var(--next);
  letter-spacing: .06em;
}
.layer p { margin: 0; }
.layer .hint, .layer .item .lab, .layer .rankcap, .layer .stats dt, .layer .ranklist li .no { color: var(--ink-soft); }
.layer .sub { font-size: calc(9px * var(--s)); color: var(--ink); }
.lead { font-size: calc(7px * var(--s)); line-height: 1.6; }
.hint { font-size: calc(7px * var(--s)); color: var(--ink-dim); }
.start {
  font-size: calc(9px * var(--s));
  margin-top: calc(4px * var(--s)) !important;
  animation: breathe 1.6s cubic-bezier(.45, 0, .55, 1) infinite; /* 消えきらずに、うすく明るくなるだけ */
}
@keyframes breathe { 50% { opacity: .55; } }
@keyframes blink { to { visibility: hidden; } }

.menu { display: flex; flex-direction: column; gap: calc(2px * var(--s)); margin-top: calc(3px * var(--s)); }
.item { display: flex; align-items: center; gap: calc(5px * var(--s)); font-size: calc(7px * var(--s)); padding: calc(1px * var(--s)) calc(4px * var(--s)); border-radius: calc(2px * var(--s)); white-space: nowrap; }
.item.sel { background: rgba(242, 201, 76, .12); }
.item .lab { color: var(--ink-dim); width: calc(40px * var(--s)); text-align: right; }
.item.sel .lab { color: var(--next); }
.item.sel .lab::before { content: "▶"; margin-right: calc(2px * var(--s)); } /* いま えらんでいる行 */
.opts { display: flex; gap: calc(3px * var(--s)); }
.opts button {
  font: inherit;
  color: var(--ink);
  background: var(--panel);
  border: 0;
  border-radius: calc(2px * var(--s));
  padding: calc(2px * var(--s)) calc(5px * var(--s));
  cursor: pointer;
}
.opts button.on { background: var(--next); color: #1a1a2e; }
.menu .note { font-size: calc(6.5px * var(--s)); color: var(--done); margin: 0; min-height: 1.4em; }

.ranklist {
  list-style: none;
  margin: calc(4px * var(--s)) 0 0;
  padding: 0;
  font-size: calc(8px * var(--s));
  min-width: calc(130px * var(--s));
}
.ranklist li { display: grid; grid-template-columns: calc(16px * var(--s)) 1fr auto; gap: calc(6px * var(--s)); padding: calc(1px * var(--s)) calc(4px * var(--s)); border-radius: calc(2px * var(--s)); }
.ranklist li .no { color: var(--ink-dim); text-align: right; }
.ranklist li .sc { color: var(--next); text-align: right; font-variant-numeric: tabular-nums; }
.ranklist li.me { background: rgba(242, 201, 76, .18); }
.ranklist li.empty { color: var(--ink-dim); grid-template-columns: 1fr; text-align: center; }
.ranklist.small { font-size: calc(7px * var(--s)); min-width: calc(80px * var(--s)); margin-top: 0; }
.ranklist.small li { gap: calc(4px * var(--s)); padding: 0 calc(3px * var(--s)); }
.rankcap { font-size: calc(6.5px * var(--s)); color: var(--ink-dim); margin: 0 0 calc(2px * var(--s)) !important; }

.namebox {
  font-size: calc(18px * var(--s));
  letter-spacing: .12em;
  min-width: calc(120px * var(--s));
  padding: calc(3px * var(--s)) calc(8px * var(--s));
  border-bottom: calc(2px * var(--s)) solid var(--next);
  min-height: 1.5em;
}
.namebox .cur { animation: blink 1s steps(2, start) infinite; color: var(--next); }
.namebox .prev { color: var(--ink-dim); }

.overgrid { display: flex; gap: calc(12px * var(--s)); align-items: flex-start; margin-top: calc(2px * var(--s)); }
.stats {
  display: grid;
  grid-template-columns: auto auto;
  gap: calc(2px * var(--s)) calc(6px * var(--s));
  margin: 0;
  font-size: calc(7px * var(--s));
  white-space: nowrap;
}
#over { gap: calc(3px * var(--s)); }
#over h2 { font-size: calc(17px * var(--s)); }
.rankcap { white-space: nowrap; }
.stats dt { color: var(--ink-dim); text-align: right; }
.stats dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
.stats dd.hl { color: var(--next); }
.praise { font-size: calc(9px * var(--s)); color: var(--done); margin-top: calc(4px * var(--s)) !important; }

/* ---- 打つところ ---- */
#panel {
  width: calc(256px * var(--s));
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 16px;
  align-items: center;
  background: var(--panel);
  border-radius: 8px;
  padding: 16px 24px;
  min-height: 168px;
}
#panel.stack { grid-template-columns: 1fr; }
/* 横にならべる時：右に打つ欄 */
#app.side {
  display: grid;
  grid-template-columns: auto 500px;
  justify-content: center;
  align-content: center;
  align-items: start;
}
/* 打つ欄の上下を、野球の画面の上下にそろえる（中身が入りきらない小さい画面では、のびてよい） */
#app.side #panel {
  width: 500px;
  min-height: calc(224px * var(--s));
  align-self: start;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
#app.side #foot { grid-column: 1 / -1; }
#panel.stack #kbwrap { justify-self: center; }
#wordbox { min-width: 0; }
#show { font-size: 24px; color: var(--ink); min-height: 1.4em; white-space: nowrap; overflow: hidden; letter-spacing: .04em; }
#kana { font-size: 40px; line-height: 1.25; letter-spacing: .04em; min-height: 1.25em; overflow-wrap: anywhere; }
#roman { font-size: 26px; letter-spacing: .08em; min-height: 1.4em; margin-top: 4px; white-space: nowrap; overflow: hidden; }
#kana .d, #roman .d { color: var(--done); }
#kana .n, #roman .n { color: var(--next); }
#roman .n { text-decoration: underline; text-underline-offset: 6px; }
#roman.shake { animation: shake .22s cubic-bezier(.36, .07, .19, .97); }
@keyframes shake {
  20% { transform: translateX(-6px); } 40% { transform: translateX(6px); }
  60% { transform: translateX(-4px); } 80% { transform: translateX(4px); }
}

#meters { margin-top: 12px; position: relative; }
.meter { display: grid; grid-template-columns: 56px 1fr; align-items: center; gap: 8px; margin-top: 6px; }
.mlab { font-size: 13px; color: var(--ink-dim); }
.bar { position: relative; height: 8px; background: var(--panel-2); border-radius: 4px; }
.bar > i:first-child { display: block; height: 100%; width: 100%; background: var(--done); border-radius: 4px; transform-origin: left; }
#timefill.low { background: var(--miss); }
#powerfill { background: var(--next) !important; transform: scaleX(0); transition: transform .15s cubic-bezier(.2, .8, .3, 1); }
.bar .tick { position: absolute; top: -3px; width: 2px; height: 14px; background: var(--ink); border-radius: 1px; }
.bar .tick.hr { background: var(--next); }
.bar .tick.dead { background: var(--line) !important; }
/* 目印の字は上下2段にして、となり同士が重ならないようにする */
#ticklabels { position: relative; height: 34px; margin-top: 4px; margin-left: 64px; font-size: 13px; color: var(--ink-dim); }
#ticklabels span { position: absolute; top: 0; transform: translateX(-50%); white-space: nowrap; }
#ticklabels span:nth-child(even) { top: 16px; }
#ticklabels span.hr { color: var(--next); }
#ticklabels span.dead { color: var(--line); text-decoration: line-through; }
#meterNote { margin: 2px 0 0; font-size: 13px; line-height: 1.5; color: var(--ink-dim); }
#powerbar.pulse { animation: pulse .3s cubic-bezier(.2, .8, .3, 1); }
@keyframes pulse { 40% { box-shadow: 0 0 0 3px rgba(242, 201, 76, .45); } }

/* キーボードのおてほん（左右に手の絵） */
#kbwrap { display: flex; flex-direction: column; gap: 8px; align-items: center; }
/* 手の絵：キーボードの下に、左手と右手をならべる */
#hands { display: flex; justify-content: center; gap: 28px; margin-top: 4px; }
.hand { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.hand svg { display: block; }
.hand figcaption { font-size: 13px; color: var(--ink-dim); }
.hand .palm, .hand .thumb { fill: #343e62; stroke: #56628a; stroke-width: 2; }
.hand .fg rect { fill: var(--c); fill-opacity: .4; stroke: #56628a; stroke-width: 2; transition: fill-opacity .12s cubic-bezier(.2, .8, .3, 1); }
.hand .fg .nail { fill: #ffffff; fill-opacity: .14; stroke: none; }
.hand .fg text { font-family: var(--font); font-size: 15px; text-anchor: middle; fill: #1a1a2e; }
/* 次のキーを押す指：その指の色で光らせ、白いふちで目立たせる */
.hand .fg.on rect:first-child { fill-opacity: 1; stroke: var(--ink); stroke-width: 3; }
.hand .fg.on .nail { fill-opacity: .4; }
#kb { display: flex; flex-direction: column; gap: 4px; }
#kb .r { display: flex; gap: 4px; }
#kb .r:nth-child(2) { padding-left: 11px; }
#kb .r:nth-child(3) { padding-left: 22px; }
#kb .r:nth-child(4) { padding-left: 33px; }
#kb .k {
  width: 31px; height: 31px;
  display: grid; place-items: center;
  font-size: 16px;
  background: var(--panel-2);
  color: var(--ink-dim);
  border-radius: 4px;
  position: relative;
  border-bottom: 3px solid var(--fc, transparent);
}
#kb .k.home::after {
  content: ""; position: absolute; bottom: 4px; width: 8px; height: 2px; background: var(--ink-dim); border-radius: 1px;
}
#kb .k.on { background: var(--next); color: #1a1a2e; }
#kb .k.bad { background: var(--miss); color: var(--ink); }
#finger { font-size: 14px; color: var(--ink-dim); min-height: 1.4em; }
#finger b { font-weight: 400; color: var(--ink); }

#foot { margin: 0; font-size: 13px; color: var(--ink-dim); text-align: center; }

</style>
</head>
<body>
<main id="app">
  <div id="screen">
    <canvas id="cv" width="512" height="448"></canvas>

    <div id="board" hidden></div>
    <div id="pitchlabel" hidden></div>
    <div id="linescore" hidden></div>
    <div id="banner" hidden></div>
    <div id="flash" hidden></div>
    <!-- 左下のボタン（音・演出をとばす・タイトルへ）。ゲームの外の操作は ボタンで できる -->
    <div id="ctrl">
      <button id="soundBtn" class="gbtn" type="button" tabindex="-1" aria-pressed="true" title="おとの オン・オフ"></button>
      <button id="skipBtn" class="gbtn" type="button" tabindex="-1" hidden>とばす ▶</button>
      <button id="quitBtn" class="gbtn" type="button" tabindex="-1" hidden>タイトルへ</button>
    </div>

    <section id="splash" class="layer">
      <h1>タイピングスタジアム</h1>
      <div class="btnrow"><button id="splashBtn" class="gbtn big primary" type="button" tabindex="-1">スタート</button></div>
      <p class="hint">おとが でます</p>
    </section>

    <section id="title" class="layer" hidden>
      <h1>タイピングスタジアム</h1>
      <p class="lead">はやく・まちがえずに うつほど ボールは とおくへ とぶ！</p>
      <div class="menu" id="menu"></div>
      <div class="btnrow mid">
        <button id="rankBtn" class="gbtn" type="button" tabindex="-1">ランキング</button>
        <button id="playBtn" class="gbtn big primary" type="button" tabindex="-1">プレイボール！</button>
        <button id="openingBtn" class="gbtn" type="button" tabindex="-1">オープニング</button>
      </div>
    </section>

    <section id="rankview" class="layer dark" hidden>
      <h2>ランキング</h2>
      <p class="sub" id="rankTitle"></p>
      <p class="hint">このパソコンの ブラウザに のこる きろくです</p>
      <ol class="ranklist" id="rankList"></ol>
      <div class="btnrow"><button id="rankBackBtn" class="gbtn primary" type="button" tabindex="-1">もどる</button></div>
    </section>

    <section id="nameentry" class="layer dark" hidden>
      <h2>ランクイン！</h2>
      <p class="sub" id="nameRank"></p>
      <p class="lead">なまえを ローマじで うってね（8もじまで）</p>
      <div class="namebox" id="nameBox"></div>
      <div class="btnrow">
        <button id="nameOkBtn" class="gbtn primary" type="button" tabindex="-1">きめる</button>
        <button id="nameDelBtn" class="gbtn" type="button" tabindex="-1">1もじ けす</button>
        <button id="nameCancelBtn" class="gbtn" type="button" tabindex="-1">きろく せずに もどる</button>

<script>
// ローマ字の入力判定（DOMに依存しない）
// 1つの言葉（ひらがな）を「打ち方の候補を持った区切り」の列に分け、
// 1キーごとに miss / ok / complete を返す。
// 「し」= shi / si / ci のように、何通りの打ち方でも正解にする。
(function (root) {
  'use strict';

  // 1文字の打ち方。先頭が「おてほん」に出す打ち方（ヘボン式の並び）
  const BASE = {
    'あ': ['a'], 'い': ['i', 'yi'], 'う': ['u', 'wu', 'whu'], 'え': ['e'], 'お': ['o'],
    'か': ['ka', 'ca'], 'き': ['ki'], 'く': ['ku', 'cu', 'qu'], 'け': ['ke'], 'こ': ['ko', 'co'],
    'さ': ['sa'], 'し': ['shi', 'si', 'ci'], 'す': ['su'], 'せ': ['se', 'ce'], 'そ': ['so'],
    'た': ['ta'], 'ち': ['chi', 'ti'], 'つ': ['tsu', 'tu'], 'て': ['te'], 'と': ['to'],
    'な': ['na'], 'に': ['ni'], 'ぬ': ['nu'], 'ね': ['ne'], 'の': ['no'],
    'は': ['ha'], 'ひ': ['hi'], 'ふ': ['fu', 'hu'], 'へ': ['he'], 'ほ': ['ho'],
    'ま': ['ma'], 'み': ['mi'], 'む': ['mu'], 'め': ['me'], 'も': ['mo'],
    'や': ['ya'], 'ゆ': ['yu'], 'よ': ['yo'],
    'ら': ['ra'], 'り': ['ri'], 'る': ['ru'], 'れ': ['re'], 'ろ': ['ro'],
    'わ': ['wa'], 'を': ['wo'],
    'が': ['ga'], 'ぎ': ['gi'], 'ぐ': ['gu'], 'げ': ['ge'], 'ご': ['go'],
    'ざ': ['za'], 'じ': ['ji', 'zi'], 'ず': ['zu'], 'ぜ': ['ze'], 'ぞ': ['zo'],
    'だ': ['da'], 'ぢ': ['di'], 'づ': ['du'], 'で': ['de'], 'ど': ['do'],
    'ば': ['ba'], 'び': ['bi'], 'ぶ': ['bu'], 'べ': ['be'], 'ぼ': ['bo'],
    'ぱ': ['pa'], 'ぴ': ['pi'], 'ぷ': ['pu'], 'ぺ': ['pe'], 'ぽ': ['po'],
    'ゔ': ['vu'],
    'ぁ': ['xa', 'la'], 'ぃ': ['xi', 'li'], 'ぅ': ['xu', 'lu'], 'ぇ': ['xe', 'le'], 'ぉ': ['xo', 'lo'],
    'ゃ': ['xya', 'lya'], 'ゅ': ['xyu', 'lyu'], 'ょ': ['xyo', 'lyo'],
    'っ': ['xtsu', 'xtu', 'ltu', 'ltsu'],
    'ゎ': ['xwa', 'lwa'],
    'ー': ['-'], '、': [','], '。': ['.'], '！': ['!'], '？': ['?'],
  };

  // 2文字でまとめて打てる組み合わせ（きゃ = kya など）
  const COMBO = {
    'きゃ': ['kya'], 'きゅ': ['kyu'], 'きょ': ['kyo'], 'きぇ': ['kye'],
    'しゃ': ['sha', 'sya'], 'しゅ': ['shu', 'syu'], 'しょ': ['sho', 'syo'], 'しぇ': ['she', 'sye'],
    'ちゃ': ['cha', 'tya', 'cya'], 'ちゅ': ['chu', 'tyu', 'cyu'], 'ちょ': ['cho', 'tyo', 'cyo'], 'ちぇ': ['che', 'tye', 'cye'],
    'にゃ': ['nya'], 'にゅ': ['nyu'], 'にょ': ['nyo'],
    'ひゃ': ['hya'], 'ひゅ': ['hyu'], 'ひょ': ['hyo'],
    'みゃ': ['mya'], 'みゅ': ['myu'], 'みょ': ['myo'],
    'りゃ': ['rya'], 'りゅ': ['ryu'], 'りょ': ['ryo'],
    'ぎゃ': ['gya'], 'ぎゅ': ['gyu'], 'ぎょ': ['gyo'],
    'じゃ': ['ja', 'zya', 'jya'], 'じゅ': ['ju', 'zyu', 'jyu'], 'じょ': ['jo', 'zyo', 'jyo'], 'じぇ': ['je', 'zye', 'jye'],
    'ぢゃ': ['dya'], 'ぢゅ': ['dyu'], 'ぢょ': ['dyo'],
    'びゃ': ['bya'], 'びゅ': ['byu'], 'びょ': ['byo'],
    'ぴゃ': ['pya'], 'ぴゅ': ['pyu'], 'ぴょ': ['pyo'],
    'ふぁ': ['fa'], 'ふぃ': ['fi'], 'ふぇ': ['fe'], 'ふぉ': ['fo'],
    'てぃ': ['thi'], 'でぃ': ['dhi'], 'でゅ': ['dhu'],
    'うぃ': ['wi'], 'うぇ': ['we'], 'ゔぁ': ['va'], 'ゔぃ': ['vi'], 'ゔぇ': ['ve'], 'ゔぉ': ['vo'],
  };

  // 訓令式を先に見せたい時の並び替え（おてほんの表示だけが変わる）
  const KUNREI_FIRST = {
    'し': 'si', 'ち': 'ti', 'つ': 'tu', 'ふ': 'hu', 'じ': 'zi',
    'しゃ': 'sya', 'しゅ': 'syu', 'しょ': 'syo', 'ちゃ': 'tya', 'ちゅ': 'tyu', 'ちょ': 'tyo',
    'じゃ': 'zya', 'じゅ': 'zyu', 'じょ': 'zyo',
  };

  const VOWELS = 'aiueo';

  function toHiragana(s) {
    return s.replace(/[ァ-ヶ]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0x60));
  }

  function ordered(kana, list, style) {
    const first = style === 'kunrei' ? KUNREI_FIRST[kana] : null;
    if (!first || list[0] === first) return list.slice();
    return [first].concat(list.filter((s) => s !== first));
  }

  function uniq(list) {
    return list.filter((s, i) => list.indexOf(s) === i);
  }

  // ひらがな1区切り分の打ち方（2文字の組み合わせは、ばらして打つ道も入れる）
  function unitAt(text, i, style) {
    const two = text.slice(i, i + 2);
    if (two.length === 2 && COMBO[two]) {
      const whole = ordered(two, COMBO[two], style);
      const a = ordered(two[0], BASE[two[0]], style);
      const b = BASE[two[1]];
      const split = [];
      a.forEach((x) => b.forEach((y) => split.push(x + y)));
      return { kana: two, spellings: uniq(whole.concat(split)) };
    }
    const one = text[i];
    if (one === 'ん' || one === 'っ') return { kana: one, spellings: null }; // 後でまとめて決める
    if (!BASE[one]) throw new Error('打ち方がわからない文字: ' + one);
    return { kana: one, spellings: ordered(one, BASE[one], style) };
  }

  // 言葉を区切りの列にする
  function tokenize(word, style) {
    const text = toHiragana(word);
    const units = [];
    for (let i = 0; i < text.length;) {
      const u = unitAt(text, i, style);
      units.push(u);
      i += u.kana.length;
    }
    // 後ろから決める（ん・っ は次の区切りを見て打ち方が変わる）
    for (let k = units.length - 1; k >= 0; k--) {
      const u = units[k];
      const next = units[k + 1];
      if (u.kana === 'ん') {
        const list = ['nn', 'xn', "n'"];
        // 次が子音で始まる時だけ n 1回でよい（あ行・や行・な行・最後は nn）
        if (next && next.spellings.every((s) => VOWELS.indexOf(s[0]) < 0 && s[0] !== 'y' && s[0] !== 'n')) {
          list.push('n');
        }
        u.spellings = list;
      } else if (u.kana === 'っ') {
        const own = BASE['っ'];
        if (next) {
          // っ + 次 を1つの区切りにまとめる（kka のように子音を重ねる道と、xtu + ka の道）
          const doubled = next.spellings
            .filter((s) => VOWELS.indexOf(s[0]) < 0 && s[0] !== 'n' && /[a-z]/.test(s[0]))
            .map((s) => s[0] + s);
          const separate = [];
          own.forEach((x) => next.spellings.forEach((y) => separate.push(x + y)));
          units.splice(k, 2, { kana: 'っ' + next.kana, spellings: uniq(doubled.concat(separate)) });
        } else {
          u.spellings = own.slice();
        }
      }
    }
    return units;
  }

  function Typer(word, options) {
    const style = (options && options.style) || 'hepburn';
    this.word = word;
    this.units = tokenize(word, style);
    this.index = 0;      // いま打っている区切り
    this.buffer = '';    // その区切りで打ったキー
    this.typed = '';     // 確定したローマ字
    this.misses = 0;
    this.done = false;
  }

  Typer.prototype._candidates = function (index, buf) {
    const u = this.units[index];
    return u ? u.spellings.filter((s) => s.startsWith(buf)) : [];
  };

  // 1キー入力。'miss' | 'ok' | 'complete'
  Typer.prototype.input = function (rawKey) {
    if (this.done) return 'complete';
    const key = String(rawKey).toLowerCase();
    if (key.length !== 1) return 'ignore';
    const buf = this.buffer + key;
    const here = this._candidates(this.index, buf);
    if (here.length > 0) {
      this.buffer = buf;
      this._settle();
      return this.done ? 'complete' : 'ok';
    }
    // いまの区切りが打ち終わっとって（ん の n など）、次の区切りの頭なら進める
    const u = this.units[this.index];
    if (u.spellings.indexOf(this.buffer) >= 0 && this._candidates(this.index + 1, key).length > 0) {
      this._commit();
      this.buffer = key;
      this._settle();
      return this.done ? 'complete' : 'ok';
    }
    this.misses++;
    return 'miss';
  };

  // ちょうど打ち終わり、これ以上伸びる候補が無ければ区切りを確定する
  Typer.prototype._settle = function () {
    const cands = this._candidates(this.index, this.buffer);
    const exact = cands.indexOf(this.buffer) >= 0;
    if (exact && cands.length === 1) this._commit();
  };

  Typer.prototype._commit = function () {
    this.typed += this.buffer;
    this.buffer = '';
    this.index++;
    if (this.index >= this.units.length) this.done = true;
  };

  // ここまで打ったローマ字
  Typer.prototype.typedRoman = function () {
    return this.typed + this.buffer;
  };

  // これから打つローマ字（おてほん）
  Typer.prototype.remainingRoman = function () {
    if (this.done) return '';
    const cur = this._candidates(this.index, this.buffer)[0] || this.units[this.index].spellings[0];
    let rest = cur.slice(this.buffer.length);
    for (let k = this.index + 1; k < this.units.length; k++) rest += this.units[k].spellings[0];
    return rest;
  };

  // 打ち終わったひらがなの文字数（読みの色を変えるため）
  Typer.prototype.kanaDone = function () {
    let n = 0;
    for (let k = 0; k < this.index; k++) n += this.units[k].kana.length;
    return n;
  };

  Typer.prototype.nextKey = function () {
    return this.remainingRoman()[0] || '';
  };

  const api = { Typer: Typer, tokenize: tokenize, toHiragana: toHiragana };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  root.Romaji = api;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
// 野球のルール（タイピングの成績 → 打席の結果）。画面に依存しない
(function (root) {
  'use strict';

  // レベル（学年の目安）ごとの持ち時間。1球の持ち時間 = 読む時間 + キー数 × 1キーの時間
  // hit = ここまでに打ち終えればヒット以上（それより遅いと ふりおくれ でアウト）
  const LEVELS = {
    g12: { label: '1・2ねん',   read: 2.0, perKey: 3.4,  hr: 0.44, hit: 0.70, rushPar: 0.88 },
    g34: { label: '3・4ねん',   read: 1.6, perKey: 1.89, hr: 0.50, hit: 0.72, rushPar: 0.92 },
    g56: { label: '5・6ねん',   read: 1.6, perKey: 1.31, hr: 0.54, hit: 0.74, rushPar: 0.99 },
    pro: { label: 'チャレンジ', read: 1.6, perKey: 0.85, hr: 0.58, hit: 0.74, rushPar: 1.10 },
  };
  const LEVEL_KEYS = ['g12', 'g34', 'g56', 'pro'];
  // 前の版の保存データ（easy/normal/hard）を読み替える
  const OLD_LEVEL = { easy: 'g12', normal: 'g34', hard: 'g56' };
  function levelOf(key) { return LEVELS[key] ? key : (OLD_LEVEL[key] || 'g12'); }

  // むずかしさ（ことばの学年とは別に えらぶ）。time = 持ち時間の倍率（小さいほど時間のバーが速く減る）
  // れんぞくでは、パワーをためるのに要るキーの数が 1/time 倍になる
  // かんたん ＝ その学年の「ふつうの子」に合わせた設定（sim.js で決めた）。速く打てる子は上の段へ
  const DIFFS = {
    easy:   { label: 'かんたん',   time: 1.0 },
    normal: { label: 'ふつう',     time: 0.75 },
    hard:   { label: 'むずかしい', time: 0.56 },
    master: { label: 'めいじん',   time: 0.42 },
  };
  const DIFF_KEYS = ['easy', 'normal', 'hard', 'master'];
  function diffOf(key) { return DIFFS[key] ? key : 'easy'; }
  function timeMul(diff) { return DIFFS[diffOf(diff)].time; }

  function limitFor(keys, level, diff) {
    const lv = LEVELS[levelOf(level)];
    return (lv.read + keys * lv.perKey) * timeMul(diff);
  }

  // 目印の線（時間のバーにも同じ値で出す）
  // ホームランの線は学年ごと（長い言葉ほど速さがならされて、速い打席が出にくいので少しゆるめる）
  // スリーベース・ツーベースは、ホームランの線から 0.07 ずつ
  function hrLine(level) { return LEVELS[levelOf(level)].hr; }
  function hitLine(level) { return LEVELS[levelOf(level)].hit; }

  // r = かかった時間 ÷ 持ち時間（0〜1）、misses = その言葉で間違えた回数
  // はやく・まちがえずに打つほど、遠くへ飛ぶ
  // 遅さを先に見る（わざと間違えてアウトをファウルに変える抜け道を作らないため）
  // ホームランにしてよいミスの数（チャレンジは言葉が長いので1回まで）
  function hrMisses(level) { return levelOf(level) === 'pro' ? 1 : 0; }

  function judgeSwing(r, misses, level) {
    if (r > hitLine(level)) return 'out';      // ふりおくれ
    if (misses >= 3) return 'foul';
    const hr = hrLine(level);
    if (misses <= hrMisses(level) && r <= hr) return 'homerun';
    if (misses === 0 && r <= hr + 0.07) return 'triple';
    if (misses <= 1 && r <= hr + 0.14) return 'double';
    return 'single';
  }

  // ---- れんぞく（1打席のあいだに言葉を次々に打つ） ----
  // 1打席の秒数。チャレンジは言葉が長いので少し長め
  const RUSH_SECONDS = { g12: 12, g34: 10, g56: 10, pro: 12 };
  function rushSeconds(level) { return RUSH_SECONDS[levelOf(level)]; }

  // パワー = 打ち終えた言葉のキー数 ÷ そのレベルで「ふつうに打てる」キー数。ミス1回でキー1.5個ぶん減る
  // ふつう = その秒数を1キーの時間で割った数（1ことばずつの持ち時間と同じ物差し）
  // rushPar = その学年の「ふつうの子」が1打席で打てる量にそろえるための倍率（シミュレーションで決めた）
  function rushPower(keysDone, misses, level, diff) {
    const lv = LEVELS[levelOf(level)];
    const par = rushSeconds(level) / lv.perKey * lv.rushPar / timeMul(diff);
    return Math.max(0, keysDone - misses * 1.5) / par;
  }

  // パワーの目盛り（ゲージにも同じ値で出す）。パワー 1 ＝ その学年の「ふつうの子」の打てる量
  // ふつうより速く打てたぶんだけ遠くへ飛ぶ。ミスはパワーを減らすだけで、ホームランを取り消さない
  const RUSH_LINES = { single: 0.95, double: 1.1, triple: 1.25, homerun: 1.4 };
  // 目盛りの間隔（学年ごと）。長い言葉の学年ほど打席ごとのぶれが小さいので、間隔をせまくする
  const RUSH_SPREAD = { g12: 1.5, g34: 1.5, g56: 1.0, pro: 0.7 };
  function rushLines(level) {
    const s = RUSH_SPREAD[levelOf(level)], out = {};
    Object.keys(RUSH_LINES).forEach((k) => { out[k] = +(1 + (RUSH_LINES[k] - 1) * s).toFixed(3); });
    return out;
  }

  function judgeRush(keysDone, misses, level, diff) {
    if (!(keysDone > 0)) return 'strike';           // 1つも打てなかったら 見のがし
    const p = rushPower(keysDone, misses, level, diff);
    const L = rushLines(level);
    if (p >= L.homerun) return 'homerun';
    if (p >= L.triple) return 'triple';
    if (p >= L.double) return 'double';
    if (p >= L.single) return 'single';
    return 'out';
  }

  function rushReason(result, words, misses) {
    const w = words + 'こ うてた';
    if (result === 'strike') return 'ひとつも うてなかった';
    if (result === 'out') return w + '… もうすこし';
    return misses === 0 ? w + '・ミスなし！' : w + '・まちがい ' + misses + 'かい';
  }

  // 結果の下に出す一言（なぜその結果になったか）
  function reasonFor(result, r, misses) {
    if (result === 'homerun') return 'ミスなし！ はやい！';
    if (result === 'out') return 'ふりおくれ… もうすこし はやく';
    if (result === 'foul') return 'まちがいが 3かい いじょう';
    if (misses === 0) return 'ミスなし！';
    return 'まちがい ' + misses + 'かい';
  }

  const HIT_BASES = { single: 1, double: 2, triple: 3, homerun: 4 };

  const RESULT_TEXT = {
    homerun: 'ホームラン！', triple: 'スリーベース！', double: 'ツーベース！', single: 'ヒット！',
    out: 'アウト', foul: 'ファウル', strike: 'ストライク', strikeout: 'さんしん', change: 'ゲームセット',
  };

  // 塁の進め方。bases = [一塁, 二塁, 三塁] の true/false
  // moves = 走る人の [出発, 到着]（0=ホーム, 4=ホームイン）
  function advance(bases, n) {
    const moves = [];
    let runs = 0;
    const next = [false, false, false];
    for (let b = 3; b >= 1; b--) {
      if (!bases[b - 1]) continue;
      const to = Math.min(b + n, 4);
      moves.push([b, to]);
      if (to === 4) runs++; else next[to - 1] = true;
    }
    const batterTo = Math.min(n, 4);
    moves.push([0, batterTo]);
    if (batterTo === 4) runs++; else next[batterTo - 1] = true;
    return { bases: next, runs: runs, moves: moves };
  }

  // 1球の結果をカウント・塁・点に反映する。戻り値の text が画面に出る字
  function apply(game, result) {
    const out = { text: RESULT_TEXT[result], moves: [], runs: 0, gameOver: false };
    if (HIT_BASES[result]) {
      const a = advance(game.bases, HIT_BASES[result]);
      game.bases = a.bases;
      game.runs += a.runs;
      game.hits++;
      if (result === 'homerun') game.homeruns++;
      game.strikes = 0;
      out.moves = a.moves;
      out.runs = a.runs;
    } else if (result === 'out') {
      game.outs++;
      game.strikes = 0;
    } else if (result === 'foul') {
      if (game.strikes < 2) game.strikes++;
    } else if (result === 'strike') {
      game.strikes++;
      if (game.strikes >= 3) {
        game.outs++;
        game.strikes = 0;
        out.text = RESULT_TEXT.strikeout;
      }
    }
    if (game.outs >= 3) out.gameOver = true;
    return out;
  }

  function newGame() {
    return { outs: 0, strikes: 0, runs: 0, hits: 0, homeruns: 0, bases: [false, false, false] };
  }

  root.Rules = {
    LEVELS: LEVELS, LEVEL_KEYS: LEVEL_KEYS, levelOf: levelOf, limitFor: limitFor,
    DIFFS: DIFFS, DIFF_KEYS: DIFF_KEYS, diffOf: diffOf, timeMul: timeMul, hrLine: hrLine, hrMisses: hrMisses,
    rushSeconds: rushSeconds, rushPower: rushPower, RUSH_LINES: RUSH_LINES, RUSH_SPREAD: RUSH_SPREAD, rushLines: rushLines, judgeRush: judgeRush, rushReason: rushReason, judgeSwing: judgeSwing, reasonFor: reasonFor, hitLine: hitLine,
    advance: advance, apply: apply, newGame: newGame, RESULT_TEXT: RESULT_TEXT,
  };

<script>
// あそびかた（試合・フリーバッティング）の進み方。画面に依存しない
//   match = 3イニングの試合。あいてチームが表に点をとり、きみは裏に打つ
//   free  = フリーバッティング。決まった打席の数で何ポイントとれるか
(function (root) {
  'use strict';

  const INNINGS = 3;
  const FREE_PITCHES = 20;
  const FREE_RUSH = 10;
  const MAX_RUNS_PER_INNING = 5;  // 少年野球によくある「1イニング5点まで」
  const HIT = { single: 1, double: 1, triple: 1, homerun: 1 };

  // 1球のポイント（ハイスコアの物差し。どちらのあそびかたでも同じ）
  const POINTS = { homerun: 100, triple: 60, double: 40, single: 20, foul: 0, out: 0, strike: 0 };
  const NO_MISS_BONUS = 10;   // ヒット以上をミスなしで打った時
  const RUN_POINTS = 30;      // 試合で1点入るごと
  // サヨナラも普通の勝ちと同じ（接戦にした方が得、にならないように。特別感は演出で出す）
  const END_BONUS = { win: 200, sayonara: 200, draw: 50, lose: 0 };

  function pointsFor(result, misses) {
    let p = POINTS[result] || 0;
    if (HIT[result] && misses === 0) p += NO_MISS_BONUS;
    return p;
  }

  // あいてチームの1イニングの点（0〜5点）。平均の点（lambda）から、ポアソン分布で 0〜5点の出やすさを作る
  // lambda は、その学年の「ふつうの子」が勝つ割合が 6割くらいになるよう、シミュレーション（sim.js）で決めた
  const CPU_LAMBDA = { g12: 1.65, g34: 1.6, g56: 1.7, pro: 2.0 };
  function poissonTable(lambda) {
    const t = [];
    let p = Math.exp(-lambda), sum = 0;
    for (let k = 0; k < MAX_RUNS_PER_INNING; k++) { t.push(p); sum += p; p = p * lambda / (k + 1); }
    t.push(1 - sum); // 5点（5点より多い分もここにまとめる＝5点まで）
    return t;
  }
  const CPU_TABLE = {};
  Object.keys(CPU_LAMBDA).forEach((k) => { CPU_TABLE[k] = poissonTable(CPU_LAMBDA[k]); });
  function cpuInning(level, rand) {
    const t = CPU_TABLE[root.Rules.levelOf(level)];
    let r = rand();
    for (let i = 0; i < t.length; i++) { r -= t[i]; if (r < 0) return i; }
    return t.length - 1;
  }

  // rush = れんぞくで打つか（フリーバッティングは1打席が長いので10打席にする）
  // diff = むずかしさ（打つ速さの段。あいての強さは ことばの学年で決まり、むずかしさでは変わらない）
  function newMatch(mode, level, rush, diff) {
    return {
      mode: mode, level: root.Rules.levelOf(level), rush: !!rush, diff: root.Rules.diffOf(diff),
      inning: 1, outs: 0, strikes: 0, bases: [false, false, false],
      runs: 0, cpu: 0, line: { me: [], cpu: [] },
      hits: 0, homeruns: 0, points: 0,
      pitchesLeft: mode === 'free' ? (rush ? FREE_RUSH : FREE_PITCHES) : null,
      // 試合は、あいての攻撃（startInning）が済んでから打てる
      readyToBat: mode === 'free',
      over: false, end: '',
    };
  }

  // 試合：イニングのはじめ（あいての攻撃＝表）。戻り値＝あいての点（受け付けない時は null）
  function startInning(m, rand) {
    if (m.mode !== 'match' || m.over || m.readyToBat) return null;
    const runs = cpuInning(m.level, rand);
    m.line.cpu.push(runs);
    m.cpu += runs;
    m.line.me.push(0);
    m.outs = 0; m.strikes = 0; m.bases = [false, false, false];
    m.readyToBat = true;
    // 最終回の表が終わった時に勝っていれば、裏の攻撃はいらない
    if (m.inning === INNINGS && m.runs > m.cpu) {
      m.line.me[m.inning - 1] = 'X';
      finish(m, 'win');
    }
    return runs;
  }

  function finish(m, end) {
    if (m.over) return;
    m.over = true;
    m.readyToBat = false;
    m.end = end;
    m.points += END_BONUS[end] || 0;
  }

  // 1球の結果を反映する
  // 戻り値: { text, runs, moves, points, inningOver, over, sayonara } / 受け付けない時は null
  function apply(m, result, misses) {
    if (m.over || !m.readyToBat) return null;
    const pts = pointsFor(result, misses);
    if (m.mode === 'free') {
      m.pitchesLeft--;
      m.points += pts;
      if (HIT[result]) m.hits++;
      if (result === 'homerun') m.homeruns++;
      if (m.pitchesLeft <= 0) finish(m, 'free');
      return { text: root.Rules.RESULT_TEXT[result], runs: 0, moves: [], points: pts, inningOver: false, over: m.over };
    }

    const lastInning = m.inning === INNINGS;
    const before = { runs: m.runs, bases: m.bases.slice() };
    const r = root.Rules.apply(m, result); // アウト・ストライク・塁・点・ヒット数をすすめる
    let runs = r.runs;
    let moves = r.moves;

    // 最終回の裏は、ホームラン以外なら決勝点が入った所で終わり（野球のきまり）
    if (lastInning && result !== 'homerun' && m.runs > m.cpu) {
      const need = m.cpu - before.runs + 1;
      if (runs > need) {
        runs = need;
        m.runs = before.runs + need;
        moves = trimMoves(moves, need);
      }
    }
    // 1イニング5点まで
    const inningRuns = m.line.me[m.inning - 1] + runs;
    let capped = false;
    if (!(lastInning && m.runs > m.cpu) && inningRuns >= MAX_RUNS_PER_INNING) {
      const allow = MAX_RUNS_PER_INNING - m.line.me[m.inning - 1];
      if (runs > allow) { m.runs -= runs - allow; moves = trimMoves(moves, allow); runs = allow; }
      capped = true;
    }

    m.line.me[m.inning - 1] += runs;
    const gained = pts + runs * RUN_POINTS;
    m.points += gained;
    const res = { text: r.text, runs: runs, moves: moves, points: gained, inningOver: false, over: false, capped: capped };

    if (lastInning && m.runs > m.cpu) {
      finish(m, 'sayonara');
      res.over = true;
      res.sayonara = true;
      return res;
    }
    if (m.outs >= 3 || capped) {
      res.inningOver = true;
      m.readyToBat = false;
      if (m.inning >= INNINGS) {
        finish(m, m.runs > m.cpu ? 'win' : m.runs === m.cpu ? 'draw' : 'lose');
        res.over = true;
      } else {
        m.inning++;
      }
    }
    return res;
  }

  // ホームインする人を、先に走っている人から need 人だけ残す（残りは塁の手前で止める）
  function trimMoves(moves, need) {
    let left = need;
    return moves.map(([from, to]) => {
      if (to < 4) return [from, to];
      if (left > 0) { left--; return [from, to]; }
      return [from, 3];
    });

    INNINGS: INNINGS, FREE_PITCHES: FREE_PITCHES, FREE_RUSH: FREE_RUSH, MAX_RUNS_PER_INNING: MAX_RUNS_PER_INNING,
    POINTS: POINTS, RUN_POINTS: RUN_POINTS, END_BONUS: END_BONUS,
    CPU_TABLE: CPU_TABLE, CPU_LAMBDA: CPU_LAMBDA, poissonTable: poissonTable, pointsFor: pointsFor, cpuInning: cpuInning, newMatch: newMatch, startInning: startInning, apply: apply,

<script>
// ハイスコア（あそびかた×うちかた×レベルごとに上位10きろく）。このパソコンのブラウザの中にだけ残る
// 同じ子が何回のってもよい（家や教室の1台で、きょうだい・友だちと比べる遊び方のため）
(function (root) {
  'use strict';

  const KEY = 'typing-stadium-ranking';
  const SIZE = 10;

  // むずかしさ ごとにも分ける（かんたんの記録と めいじんの記録は くらべられないため）
  function keyOf(mode, rush, level, diff) {
    const lv = root.Rules ? root.Rules.levelOf(level) : level;
    const df = root.Rules ? root.Rules.diffOf(diff) : (diff || 'easy');
    return mode + ':' + (rush ? 'rush' : 'one') + ':' + lv + ':' + df;
  }

  function validScore(score) { return Number.isSafeInteger(score) && score > 0; }

  // ランクインできるか（0点はのせない）
  function qualifies(list, score) {
    if (!validScore(score)) return false;
    return list.length < SIZE || score > list[list.length - 1].score;
  }

  function order(list) {
    return list.slice().sort((a, b) => b.score - a.score || (a.time || 0) - (b.time || 0)).slice(0, SIZE);
  }

  // 新しい記録を入れて、上位10きろくに並べ直す。同じ点なら先に出した人が上
  // 戻り値: { list, rank }（rank は 1 から。入らなければ 0）
  function insert(list, entry) {
    if (!entry || !validScore(entry.score)) return { list: order(list), rank: 0 };
    const top = order(list.concat([entry]));
    return { list: top, rank: top.indexOf(entry) + 1 };
  }

  function cleanName(s) {
    return String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 8);
  }

  function loadAll(storage) {
    try {
      const v = JSON.parse((storage || root.localStorage).getItem(KEY) || '{}');
      return v && typeof v === 'object' ? v : {};
    } catch (e) { return {}; }
  }
  function saveAll(all, storage) {
    try { (storage || root.localStorage).setItem(KEY, JSON.stringify(all)); return true; } catch (e) { return false; }
  }
  // 保存データは信用せず、正しい記録だけを点の順に10件まで返す
  function listFor(all, mode, rush, level, diff) {
    const l = all[keyOf(mode, rush, level, diff)];
    if (!Array.isArray(l)) return [];
    return order(l.filter((e) => e && validScore(e.score)).map((e) => ({
      name: cleanName(e.name) || '???', score: e.score, acc: Number(e.acc) || 0, time: Number(e.time) || 0,
    })));
  }

  root.Ranking = { SIZE: SIZE, keyOf: keyOf, qualifies: qualifies, insert: insert, cleanName: cleanName, loadAll: loadAll, saveAll: saveAll, listFor: listFor };
})(typeof window !== 'undefined' ? window : globalThis);

// 画面の座標は 256×224。実際のキャンバスは 2倍（512×448）で、人物と線は 0.5 ドットの細かさで描く

    q = 1 / S;
    G.setTransform(S, 0, 0, S, 0, 0);

  }

  function disc(cx, cy, r, c, maxY) {
    G.fillStyle = c;

    for (let k = -N; k <= N; k++) {

  // ---------------------------------------------------------

  const BATTER_KEYS = [

  // バットの向き（上から見た角度・上下の角度）→ 画面の上の向き。奥（ピッチャーの方）は 0.35 にちぢめて上へ
  function batDir(phi, eps) {

  function batterPose(x0, y, u, wag) {

    const shR = add(sh, [(4.2 * Math.sin(R) - 1.5 * Math.cos(R)) * wd, 1.2 * Math.cos(R)]);
    const hip = o(ys(P.hip));
    const hipF = add(hip, [(-2.8 * Math.sin(HR) + 1.0 * Math.cos(HR)) * wd, -0.8 * Math.cos(HR)]);
    const hipR = add(hip, [(2.8 * Math.sin(HR) - 1.0 * Math.cos(HR)) * wd, 0.8 * Math.cos(HR)]);
    const bd = batDir(P.phi, P.eps);
    const grip = o(ys(P.grip));
    const top = add(grip, [bd.v[0] * 1.8 * wd, bd.v[1] * 1.8 * wd]);  // 上の手（右手）は先の方
    const tip = add(grip, [bd.v[0] * B.bat, bd.v[1] * B.bat]);
    const knob = add(grip, [-bd.v[0] * 1.2 * wd, -bd.v[1] * 1.2 * wd]);
    const head = headAt(neck, P.neck, P.head, B.head);
    return { P, B, sh, shF, shR, hip, hipF, hipR, grip, top, tip, knob, bd, head, neck, fF: o(ys(P.fF)), fR: o(ys(P.fR)), x0, y };

  function batter(x0, y, u, wag) {
    if (typeof u === 'string') u = { stance: 0, swing: SWING_CONTACT, follow: 1 }[u] || 0;
    const Z = batterPose(x0, y, u, wag), P = Z.P, B = Z.B, wd = B.limb;
    const thigh = B.hip * 0.56, upper = (B.neck - B.hip) * 0.6, fore = (B.neck - B.hip) * 0.56;
    ellipse(x0 + 2, y + 0.5, 12, 2.2, C.shadow);
    // 足：ひざは打つ方向（右）へ曲がる。ふとももは白、すねは紺のストッキング、くつは黒
    const leg = (hp, ft, heel) => {
      const kn = ik(hp, ft, thigh, thigh * 1.02, (a, b) => a[0] > b[0]);
      limb(kn, ft, 2.8 * wd, C.navy);
      limb(hp, kn, 3.4 * wd, C.white);
      rect(kn[0] - 1.2, kn[1] - 0.6, 2.4, 0.5, C.whiteD);     // ひざのしわ

      else { limb([ft[0] - 1.2 * wd, ft[1]], [ft[0] + 2.4 * wd, ft[1]], 1.8 * wd, C.shoe); dot(ft[0] - 0.5, ft[1] - 0.5, C.shoeL); }

      limb(el, hand, 2.2 * wd, C.navy);
      limb(s, el, 2.6 * wd, C.navy);
      disc(s[0], s[1], 1.6 * wd, C.white);                     // 半そで
    };
    const glove = (p) => { const r = 1.2 * wd; disc(p[0], p[1], r + 0.5, C.K); disc(p[0], p[1], r, C.red); dot(p[0] - 0.5, p[1] - 0.5, C.redL); };
    const drawBat = () => {
      const mid = mix(Z.knob, Z.tip, 0.42);
      limb(Z.knob, mid, 1.3 * wd, C.bat);
      limb(mid, Z.tip, 2.4 * wd, C.bat);

    // からだ（ユニフォーム）：横向き（rot 0）は胸の厚み、後ろ向き（rot 1）は肩はば
    // 下は腰の線で止める（丸い下はしが ふとももに かぶって、足が消えたように見えないように）
    const tw = (7 + 2.6 * clamp01(P.rot)) * wd;
    trunk(Z.sh, Z.hip, tw + 2 * q, tw * 0.92 + 2 * q, q, C.K);

    capsule(add(Z.sh, side), add(Z.hip, [side[0] + 0.3, -0.8]), 1.4, C.whiteD);
    // 足は いつも胴の下に見える（かまえから振り終わりまで 同じ作り）
    leg(Z.hipF, Z.fF, false);

    if (P.rot < 0.5) {                                              // 前立て（胸のボタンの線）
      const fx = (tw / 2) - 1.4;
      capsule(add(Z.sh, [fx, 0.8]), add(Z.hip, [fx, -1.5]), 0.5, C.navy);
      rect(Z.sh[0] + fx - 3.2, Z.sh[1] + 1.4, 2, 2, C.navy);      // 胸のマーク
      dot(Z.sh[0] + fx - 2.7, Z.sh[1] + 1.9, C.white);
    } else {                                                        // 背番号
      text3('7', Z.sh[0] - 0.7, Z.sh[1] + 1.6, C.navy, 0.5);

    capsule(Z.hipF, Z.hipR, 1.6, C.navyD);                         // ベルト
    capsule(add(Z.hip, [-tw / 2 + 0.8, 0]), add(Z.hip, [tw / 2 - 0.8, 0]), 1.4, C.navyD);
    dot(Z.hip[0] + 0.5, Z.hip[1] - 0.25, C.fenceTop);

    const arms = () => {

    const late = u > 0.8;
    if (late) arms();
    // 首と頭（ヘルメット）。顔はいつもピッチャー〜打球の方を見る
    // 寸法は 半径 4.4 の頭で決めてあり、k 倍に大きくする（目は 人形っぽく 大きめ）
    const hd = Z.head, k = B.head / 4.4;
    capsule(Z.neck, add(hd, [0, 2 * k]), 2.2 * wd, C.skinD);
    disc(hd[0], hd[1], B.head + 0.5, C.K);
    disc(hd[0], hd[1], B.head, C.skin);
    disc(hd[0] - 1.4 * k, hd[1] + 0.6 * k, 3.2 * k, C.hair, hd[1] + 1.8 * k);   // 後ろ髪
    disc(hd[0], hd[1] - 0.4 * k, 4.5 * k, C.navy, hd[1] - 0.6 * k);             // ヘルメット
    rect(hd[0] - 4.6 * k, hd[1] - 0.8 * k, 6 * k, 3.8 * k, C.navy);             // 耳あて（キャッチャーがわ）
    rect(hd[0] - 4.6 * k, hd[1] + 2.5 * k, 6 * k, 0.5, C.navyD);
    rect(hd[0] - 3.5 * k, hd[1] - 4 * k, 3 * k, 0.8, C.navyL);                  // つや
    rect(hd[0] + 1 * k, hd[1] - 1 * k, 4.6 * k, 1.2 * k, C.navyD);               // つば
    rect(hd[0] + 2.2 * k, hd[1] + 0.5 * k, 0.6 * k + 0.2, 1.3 * k, C.K);         // 目
    dot(hd[0] + 2.2 * k, hd[1] + 0.5 * k, C.whiteL);                             // 目の光
    rect(hd[0] + 3.3 * k, hd[1] + 2.3 * k, 1 * k, 0.5, C.blush);

  // 胴：上は丸く（肩）、下は まっすぐ切る。a = 肩の中心、b = 腰の中心、grow = 下へのばす（ふちどり用）
  function trunk(a, b, wTop, wBot, grow, c) {
    const dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy) || 1;
    const nx = -dy / L, ny = dx / L, e = [b[0] + dx / L * grow, b[1] + dy / L * grow];
    disc(a[0], a[1], wTop / 2, c);
    poly([[a[0] + nx * wTop / 2, a[1] + ny * wTop / 2], [e[0] + nx * wBot / 2, e[1] + ny * wBot / 2],
      [e[0] - nx * wBot / 2, e[1] - ny * wBot / 2], [a[0] - nx * wTop / 2, a[1] - ny * wTop / 2]], c);
  }
  // バットの芯（先から3割）の場所。ボールはここに当たる
  function sweetSpot(x0, y, u) {
    const Z = batterPose(x0, y, u === undefined ? SWING_CONTACT : u);
    return mix(Z.knob, Z.tip, 0.72);
  }

  // ---------------------------------------------------------
  //  ピッチャー（守るチーム・右投げ）。こちら（ホーム）を向いて投げる
  //  p = 0 セット（三塁の方を向いて立つ）→ .3 足を上げる → .48 手を分ける → .62 ふみ出す
  //      → .72 ボールをはなす（上から）→ 1 投げ終わり（前にかがみ、右足が上がる）
  //  fa = 体の向き（0 横向き＝左を向く / 1 こちらを向く）
  // ---------------------------------------------------------
  const RELEASE_AT = 0.72;
  const PITCHER_KEYS = [
    [0.00, { hip: [0, -9.2], neck: [-0.3, -15.6], head: [-0.6, -18.5], fa: 0, gl: [-2.4, -13.4], th: [-1.6, -13.6], fL: [-1.2, 0.4], fR: [1.2, -0.3] }],
    [0.30, { hip: [0.4, -9.6], neck: [0.6, -16.2], head: [0.4, -19.1], fa: 0, gl: [-1.6, -15], th: [-1, -15.2], fL: [-1.4, -5.4], fR: [1, -0.3] }],
    [0.48, { hip: [-0.2, -9.1], neck: [0, -15.7], head: [-0.4, -18.5], fa: 0.05, gl: [-4.8, -14.2], th: [4.2, -11.8], fL: [-2.8, -2.4], fR: [1.2, -0.3] }],
    [0.62, { hip: [-0.6, -7.8], neck: [-0.6, -14.4], head: [-0.8, -17.2], fa: 0.45, gl: [-3, -12.6], th: [2.8, -19.6], fL: [-2.2, 2.6], fR: [1.6, -0.2] }],
    [0.72, { hip: [-0.8, -7.3], neck: [-1, -13], head: [-1.2, -15.8], fa: 1, gl: [1.8, -11.4], th: [-3.3, -16.4], fL: [-2.2, 2.6], fR: [1.8, -0.8] }],
    [0.84, { hip: [-0.8, -7], neck: [-1.2, -11.6], head: [-1.4, -14.3], fa: 1, gl: [2, -10.2], th: [0.2, -8.4], fL: [-2.2, 2.6], fR: [2.4, -3.2] }],
    [1.00, { hip: [-0.6, -6.9], neck: [-1.2, -10.8], head: [-1.4, -13.4], fa: 1, gl: [1.8, -9.6], th: [2.6, -5.4], fL: [-2.2, 2.6], fR: [2.8, -5.2] }],
  ];
  function pitcherPose(p) {
    const P = tween(PITCHER_KEYS, p);
    const B = BODY.p, wd = BODY.limb, ys = (v) => [v[0], stretch(v[1], 9.2, 15.6, B)];
    const o = (v) => [MOUND[0] + v[0], MOUND[1] + v[1]];
    const A = clamp01(P.fa) * Math.PI / 2;
    const neck = o(ys(P.neck));
    const sh = add(neck, [0, 1.1 * wd]);
    // 左肩（グラブ）と右肩（投げる手）。横向きでは左肩が手前（下）、正面では右肩が左に来る
    const shL = add(sh, [2.2 * wd * Math.sin(A), 0.6 * Math.cos(A)]);
    const shR = add(sh, [-2.2 * wd * Math.sin(A), -0.6 * Math.cos(A)]);
    const hip = o(ys(P.hip));
    const hipL = add(hip, [1.4 * wd * Math.sin(A), 0.5 * Math.cos(A)]);
    const hipR = add(hip, [-1.4 * wd * Math.sin(A), -0.5 * Math.cos(A)]);
    const head = headAt(neck, P.neck, P.head, B.head);
    return { P, B, A, sh, shL, shR, hip, hipL, hipR, neck, head, gl: o(ys(P.gl)), th: o(ys(P.th)), fL: o(ys(P.fL)), fR: o(ys(P.fR)) };
  }
  function pitcherHand(p) { return pitcherPose(p).th; }
  function pitcher(p) {
    if (typeof p === 'string') p = { set: 0, lift: 0.3, throw: 0.9 }[p] || 0;
    const Z = pitcherPose(p), P = Z.P, B = Z.B, wd = BODY.limb;
    const thigh = B.hip * 0.51, upper = (B.neck - B.hip) * 0.55, fore = (B.neck - B.hip) * 0.52;
    const face = [-Math.cos(Z.A), 0.35 * Math.sin(Z.A)];               // 向いている方
    const toward = (base) => (a, b) => (a[0] - base[0]) * face[0] + (a[1] - base[1]) * face[1] > (b[0] - base[0]) * face[0] + (b[1] - base[1]) * face[1];
    ellipse(MOUND[0] - 0.5, MOUND[1] + 0.8, 6.5, 1.4, C.shadow);
    const leg = (hp, ft) => {
      const kn = ik(hp, ft, thigh, thigh, toward(hp));
      limb(kn, ft, 1.6 * wd, C.gray);
      limb(hp, kn, 2 * wd, C.gray);
      rect(ft[0] - 1, ft[1] - 1.3, 2, 0.6, C.red);                    // ストッキング
      limb([ft[0] - 0.9 * wd, ft[1]], [ft[0] + 0.6 * wd, ft[1]], 1 * wd, C.shoe);
    };
    const arm = (s, hand, isGlove) => {
      const el = ik(s, hand, upper, fore, isGlove ? (a, b) => a[1] > b[1] : (a, b) => Math.abs(a[0] - Z.sh[0]) > Math.abs(b[0] - Z.sh[0]));
      limb(s, el, 1.5 * wd, C.red);
      limb(el, hand, 1.3 * wd, C.red);
      if (isGlove) { const r = 1.1 * wd; disc(hand[0], hand[1], r + 0.5, C.K); disc(hand[0], hand[1], r, C.glove); dot(hand[0] - 0.5, hand[1] - 0.5, C.gloveL); }
      else { disc(hand[0], hand[1], 0.5 * wd + 0.4, C.K); disc(hand[0], hand[1], 0.5 * wd, C.skin); }
    };
    const body = () => {
      const tw = (4 + 1.2 * Math.sin(Z.A)) * wd;
      capsule(Z.sh, Z.hip, tw + 2 * q, C.K);
      capsule(Z.sh, Z.hip, tw, C.gray);
      capsule(add(Z.sh, [tw / 2 - 0.6, 0.4]), add(Z.hip, [tw / 2 - 0.6, -0.4]), 0.8, C.grayD);
      capsule(add(Z.hip, [-tw / 2 + 0.6, 0]), add(Z.hip, [tw / 2 - 0.6, 0]), 0.8, C.redD); // ベルト
      if (Z.A > 0.7) { rect(Z.sh[0] - 1, Z.sh[1] + 1, 2, 0.5, C.red); }                    // 胸の文字
    };
    const head = () => {
      // 寸法は 半径 2.3 の頭で決めてあり、k 倍に大きくする
      const h = Z.head, k = B.head / 2.3;
      disc(h[0], h[1], B.head + 0.5, C.K);
      disc(h[0], h[1], B.head, C.skin);
      disc(h[0], h[1] - 0.6 * k, 2.4 * k, C.red, h[1] - 0.9 * k);        // 帽子
      dot(h[0] - 0.5 * k, h[1] - 2.4 * k, C.redL);
      const s = Math.sin(Z.A);
      // つば：横向きでは左へ出る、正面では下の帯になる
      rect(h[0] - (2.6 + 1.4 * (1 - s)) * k, h[1] - 1 * k, (2.6 + 1.4 * (1 - s) + 2.6 * s) * k, 0.8 * k, C.redD);
      const eh = Math.max(0.5, 0.5 * k);                               // 目（人形っぽく たて長）
      if (s > 0.6) { rect(h[0] - 1.1 * k, h[1] + 0.3 * k, 0.5, eh, C.K); rect(h[0] + 0.6 * k, h[1] + 0.3 * k, 0.5, eh, C.K); }
      else rect(h[0] - 1.5 * k, h[1] + 0.3 * k, 0.5, eh, C.K);
    };
    if (Z.A < Math.PI / 4) {
      arm(Z.shR, Z.th, false);
      leg(Z.hipR, Z.fR);
      body();
      leg(Z.hipL, Z.fL);
      head();
      arm(Z.shL, Z.gl, true);
    } else {
      leg(Z.hipR, Z.fR);
      leg(Z.hipL, Z.fL);
      body();
      head();
      arm(Z.shL, Z.gl, true);
      arm(Z.shR, Z.th, false);
    }
    // ボールを持っている間は、手（またはグラブ）の中に見える
    if (p > 0.4 && p < RELEASE_AT) ball(Z.th[0], Z.th[1], 0.6);

  // ---------------------------------------------------------
  //  投げたボールの通り道（t=0 手をはなす → t=1 着く）
  //  近づくほど 速く・大きく見える（遠くは ゆっくり小さく）。曲がりと落ちは 奥ほど小さく見える
  //  pitch = { arc: 山なりの高さ, dx: 横の曲がり（+ が右）, drop: すとんと落ちる量 }、to = 着く場所
  // ---------------------------------------------------------
  const DEPTH = 3;                                // マウンドはホームの 3倍 遠い
  function nearness(t) { const z = DEPTH - (DEPTH - 1) * t; return (1 / z - 1 / DEPTH) / (1 - 1 / DEPTH); }
  function pitchPos(t, pitch, to) {
    pitch = pitch || {};
    to = to || MITT;
    const from = pitcherHand(RELEASE_AT);
    const s = nearness(clamp01(t)), z = DEPTH - (DEPTH - 1) * clamp01(t), k = 1 / z;
    // まっすぐの線からのずれ：横に曲がる球は はじめ逆にふくらみ、最後に曲がる。重力で山なり
    const bulge = t * (1 - t);
    const offX = -(pitch.dx || 0) * bulge * k * 2.2;
    const rise = ((pitch.arc || 0) * bulge + (pitch.drop || 0) * (t - Math.pow(t, 4))) * k * 2;
    const x = lerp(from[0], to[0], s) + offX, y = lerp(from[1], to[1], s) - rise;
    return { x: x, y: y, r: lerp(0.55, 2.4, s), sx: lerp(MOUND[0] - 2, to[0] - 1, s), sy: lerp(MOUND[1] + 1, 193, s) };
  }
  // 打ったボール（t=0 当たった所 → t=1）。遠ざかるほど ゆっくり小さく見える
  function hitPos(t, from, to) {
    const z = 1 + 5 * clamp01(t), s = (1 - 1 / z) / (1 - 1 / 6);
    return { x: lerp(from[0], to[0], s), y: lerp(from[1], to[1], s), r: lerp(2.4, 0.6, s) };
  }

  // キャッチャー（後ろすがた）。ミット（左手）は ボールの来る所へ出す。右手は背中の後ろにかくす
  function catcher(mitt) {
    const cx = 128, y = 222;
    mitt = mitt || MITT;
    // ミットを出した左腕：前（ピッチャーの方）へのばすので、背中と頭のかげに かくれる
    const shL = [cx - 8, y - 18.5], hand = [mitt[0] - 0.5, mitt[1] + 3];
    const el = ik(shL, hand, 8, 8, (a, b) => a[0] < b[0]);
    limb(shL, el, 3, C.gray);
    limb(el, hand, 2.6, C.gray);
    disc(mitt[0], mitt[1], 4.6, C.K);
    disc(mitt[0], mitt[1], 4.1, C.glove);
    disc(mitt[0] + 0.4, mitt[1] + 0.5, 2.2, C.gloveD);
    disc(mitt[0] - 1.6, mitt[1] - 1.8, 0.9, C.gloveL);
    // しゃがんだ足：かかと（くつ）・ふくらはぎ・おしり
    [-1, 1].forEach((sg) => {
      ellipse(cx + sg * 9.5, y - 3.5, 4.6, 4, C.K);
      ellipse(cx + sg * 9.5, y - 3.5, 4.1, 3.5, C.gray);
      rect(cx + sg * 9.5 - 3.5, y - 5.5, 7, 0.8, C.redD);               // レガースのベルト
      rect(cx + sg * 9.5 - 3.5, y - 2.5, 7, 0.8, C.redD);
      ellipse(cx + sg * 9.5, y + 0.5, 3.6, 1.4, C.shoe);
    });
    ellipse(cx, y - 7.5, 11.5, 4.6, C.K);
    ellipse(cx, y - 7.5, 11, 4.1, C.gray);
    ellipse(cx - 4, y - 8.5, 4.5, 1.6, C.grayL);
    rect(cx - 0.25, y - 11, 0.5, 6.5, C.grayD);
    // 背中（肩はばが広く、腰へ少し細くなる）
    const back = [[cx - 10.5, y - 19], [cx + 10.5, y - 19], [cx + 9, y - 9], [cx - 9, y - 9]];
    poly([[cx - 11, y - 19.5], [cx + 11, y - 19.5], [cx + 9.5, y - 8.5], [cx - 9.5, y - 8.5]], C.K);
    poly(back, C.gray);
    poly([[cx - 10.5, y - 19], [cx - 7.5, y - 19], [cx - 6.8, y - 9], [cx - 9, y - 9]], C.grayD);
    disc(cx - 10, y - 18, 2.4, C.K); disc(cx - 10, y - 18, 1.9, C.gray);   // 肩

        A.batter(...A.BAT_POS, batterU(), time < 2.5 ? time : 0);
        A.catcher(A.MITT);
        if (time >= 3.25 && time < hit) {
          const b = A.pitchPos(span(3.25, hit), STRAIGHT, sweet);
          A.ball(b.x, b.y, b.r);
        }
        if (time >= hit) {
          // センターの方へ高く上がって、遠ざかりながら小さくなる
          const p = span(hit, hit + .85), b = A.hitPos(p, sweet, [124, 4]), tail = A.hitPos(Math.max(0, p - .035), sweet, [124, 4]);
          A.line(tail.x, tail.y, b.x, b.y, A.C.light, 1);
          A.ball(b.x, b.y, b.r);
          burst(sweet[0], sweet[1], time - hit, A.C.fenceTop);
        }
        if (time < 2) {
          A.rect(0, 0, 256, 224, 'rgba(3,7,22,' + (.88 * (1 - clamp((time - .3) / 1.7))) + ')');
          [6, 228].forEach((x, i) => {
            const lit = time >= (i ? .95 : .35);
            A.rect(x, 0, 22, 8, A.C.K);
            for (let j = 0; j < 10; j++) A.rect(x + 1 + (j % 5) * 4, 1 + Math.floor(j / 5) * 3, 3, 2, lit ? A.C.light : A.C.stand);
            if (lit) {
              ctx.fillStyle = 'rgba(255,244,194,.08)'; ctx.beginPath();
              ctx.moveTo(x + 11, 8); ctx.lineTo(x - 60, 160); ctx.lineTo(x + 85, 160); ctx.fill();
            }
          });
        }
      }
      function field() {
        ctx.drawImage(backgrounds[1], 0, 0, 256, 224);
        const p = clamp((time - 5) / 2.3), target = A.P(15, A.FENCE - 7);
        Object.entries(A.FIELDERS).forEach(([name, pos]) => {
          const chasing = ['LF', 'CF', 'RF'].includes(name);
          const v = chasing ? clamp(p * (name === 'CF' ? .85 : .55)) : 0;
          A.mini(mix(pos[0], target[0], v), mix(pos[1], target[1], v), 'field', Math.floor(time * 8) % 2, 1, chasing);
        });
        A.mini(mix(128, 158, p), mix(206, 176, p), 'bat', Math.floor(time * 9) % 2, 0, true);
        const ground = A.P(15, 18 + p * 170);
        A.ellipse(ground[0], ground[1], 3, 1, A.C.shadow);
        A.ball(ground[0], ground[1] - Math.sin(p * Math.PI) * 40, 2.5);
        burst(64, 49, time - 6.8, A.C.fenceTop);
        burst(195, 60, time - 7.1, A.C.white);
        if (time >= 6.65) text('やった！ ホームラン！', 115, 13);
      }
      function ending() {
        ctx.drawImage(backgrounds[1], 0, 0, 256, 224);
        A.rect(0, 0, 256, 224, 'rgba(8,14,39,.8)');
        if (time < title) {
          const p = clamp((time - 7.5) / (title - 7.5));
          A.ball(mix(177, 128, p), mix(35, 109, p), 4 + p * p * 45);
          return;
        }
        const age = time - title;
        burst(128, 109, age, A.C.fenceTop, 40);
        const scale = 1 + .17 * Math.exp(-age * 8) * Math.cos(age * 16);
        ctx.save(); ctx.translate(128, 110); ctx.scale(scale, scale); ctx.translate(-128, -110);
        A.rect(19, 66, 218, 91, A.C.navyD);
        A.rect(19, 66, 218, 2, A.C.fenceTop); A.rect(19, 155, 218, 2, A.C.fenceTop);
        text('タイピング', 91, 27); text('スタジアム', 127, 29);
        ctx.restore();
        for (let i = 0; i < 12; i++) {
          const x = 15 + ((i * 47) % 230), y = 27 + ((i * 71) % 174);
          const s = 1 + Math.sin(age * 2 + i) * .5;
          A.line(x - s * 2, y, x + s * 2, y, A.C.light);
          A.line(x, y - s * 2, x, y + s * 2, A.C.light);
        }
        if (time >= 10) text('キーを おして はじめよう', 189, 11, A.C.white);
      }
      return {
        update(dt) {
          if (ended || !Number.isFinite(dt) || dt <= 0) return;
          time = Math.min(duration, time + dt);
          while (next < cues.length && cues[next][0] <= time) {
            const cue = cues[next++];
            // Do not replay stale sounds after a suspended tab or a large jump.
            if (time - cue[0] <= .25 && time < duration) cue[1]();
          }
          if (time >= duration) { ended = true; stop(false); }
        },
        draw() {
          A.use(ctx); ctx.save(); ctx.imageSmoothingEnabled = false;
          A.rect(0, 0, 256, 224, A.C.sky);
          if (time >= hit && time < hit + .22) ctx.translate(Math.round(Math.sin((time - hit) * 90) * 2), 0);
          if (time < 5) batting(); else if (time < 7.5) field(); else ending();
          ctx.restore();
        },
        skip() { ended = true; stop(true); },
        get done() { return ended; },
        get t() { return time; }
      };
    }
  };
})(window);

</script>
<script>
// タイピングスタジアム 本体（ゲームの流れ・画面の部品・キー入力）
// 絵は sprites.js（Art）、音は sound.js（Sound）、野球のきまりは rules.js / match.js、ハイスコアは ranking.js
(function () {

  const A = Art, W = A.W, H = A.H, C = A.C;

  const mix2 = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t)];
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  const ui = {
    board: $('board'), pitchlabel: $('pitchlabel'), linescore: $('linescore'), banner: $('banner'), flash: $('flash'),
    splash: $('splash'), title: $('title'), menu: $('menu'), rankview: $('rankview'), rankTitle: $('rankTitle'), rankList: $('rankList'),
    nameentry: $('nameentry'), nameRank: $('nameRank'), nameBox: $('nameBox'),
    over: $('over'), overTitle: $('overTitle'), overSub: $('overSub'), stats: $('stats'), overRank: $('overRank'), praise: $('praise'),
    panel: $('panel'), show: $('show'), kana: $('kana'), roman: $('roman'),
    timeLab: $('timeLab'), timefill: $('timefill'), timebar: $('timebar'),
    powerMeter: $('powerMeter'), powerfill: $('powerfill'), powerbar: $('powerbar'), ticklabels: $('ticklabels'), meterNote: $('meterNote'),
    kb: $('kb'), finger: $('finger'),
  };

  // =========================================================
  //  せってい（タイトルで えらぶもの）
  // =========================================================
  const MENU = [
    { key: 'mode', label: 'あそびかた', opts: [['match', 'しあい', '3イニングで あいてと しょうぶ。1イニング5てんまで'], ['free', 'フリーバッティング', () => (settings.rush ? Match.FREE_RUSH : Match.FREE_PITCHES) + 'だせきで ポイントに ちょうせん']] },
    { key: 'rush', label: 'うちかた', opts: [[false, '1ことばずつ', '1きゅうに 1ことば。うちおわったら ピッチャーが なげる'], [true, 'れんぞく', 'じかんない に ことばを つぎつぎ うって パワーを ためる']] },
    { key: 'level', label: 'ことば', opts: [
      ['g12', Rules.LEVELS.g12.label, 'みじかい ことば'],
      ['g34', Rules.LEVELS.g34.label, 'っ・ゃ・ー が でてくる'],
      ['g56', Rules.LEVELS.g56.label, 'すこし ながい ことば'],
      ['pro', Rules.LEVELS.pro.label, 'ながい ことばに ちょうせん'],
    ] },
    { key: 'diff', label: 'むずかしさ', opts: [
      ['easy', Rules.DIFFS.easy.label, 'じかんに よゆうが ある。はじめての 子に'],
      ['normal', Rules.DIFFS.normal.label, 'じかんの バーが すこし はやく へる'],
      ['hard', Rules.DIFFS.hard.label, 'はやく うたないと まにあわない'],
      ['master', Rules.DIFFS.master.label, 'タイピングの めいじんに ちょうせん'],
    ] },
    { key: 'style', label: 'おてほん', opts: [['hepburn', 'shi・chi', 'おてほんの かきかた。どちらで うっても せいかい'], ['kunrei', 'si・ti', 'おてほんの かきかた。どちらで うっても せいかい']] },
  ];
  const settings = { mode: 'match', rush: false, level: 'g12', diff: 'normal', style: 'hepburn', name: '', sound: true };
  try {
    const s = JSON.parse(localStorage.getItem('typing-stadium') || '{}');
    if (s.mode === 'free') settings.mode = 'free';
    settings.rush = s.rush === true;
    settings.level = Rules.levelOf(s.level);
    if (s.diff) settings.diff = Rules.diffOf(s.diff);
    if (s.style === 'kunrei') settings.style = 'kunrei';
    settings.name = Ranking.cleanName(s.name);
    if (s.sound === false) settings.sound = false;
  } catch (e) { /* 保存できない環境でも遊べる */ }
  function saveSettings() { try { localStorage.setItem('typing-stadium', JSON.stringify(settings)); } catch (e) { /* なし */ } }

  let menuSel = 0;
  function renderMenu() {
    ui.menu.innerHTML = '';

    MENU.forEach((row, ri) => {
      const item = document.createElement('div');

        const b = document.createElement('button');
        b.textContent = text;
        if (settings[row.key] === v) { b.className = 'on'; if (ri === menuSel) note = typeof n === 'function' ? n() : n; }
        b.onclick = () => { settings[row.key] = v; menuSel = ri; saveSettings(); renderMenu(); };
        opts.appendChild(b);
      });
      item.appendChild(opts);
      ui.menu.appendChild(item);
    });
    // 説明は、えらんでいる行のぶんだけをメニューの下に出す
    const nt = document.createElement('p');
    nt.className = 'note';
    nt.textContent = note || ' ';
    ui.menu.appendChild(nt);
    setupMeters(); // 下のメーターも、えらんだ うちかた の形にする
  }
  function stepMenu(dir) {
    const row = MENU[menuSel];
    const i = row.opts.findIndex((o) => o[0] === settings[row.key]);
    const j = Math.max(0, Math.min(row.opts.length - 1, i + dir));
    settings[row.key] = row.opts[j][0];
    saveSettings();
    renderMenu();
  }

  // =========================================================
  //  キーボードと指のおてほん
  // =========================================================
  const KB_ROWS = ['1234567890-', 'qwertyuiop', 'asdfghjkl', 'zxcvbnm'];
  // 指：1=ひだり こゆび … 4=ひだり ひとさしゆび、5=みぎ ひとさしゆび … 8=みぎ こゆび
  const FINGER_OF = {};
  [['1qaz', 1], ['2wsx', 2], ['3edc', 3], ['45rtfgvb', 4], ['67yuhjnm', 5], ['8ik', 6], ['9ol', 7], ['0-p', 8]].forEach(([keys, f]) => keys.split('').forEach((k) => { FINGER_OF[k] = f; }));
  const FINGER_NAME = { 1: 'ひだりての こゆび', 2: 'ひだりての くすりゆび', 3: 'ひだりての なかゆび', 4: 'ひだりての ひとさしゆび', 5: 'みぎての ひとさしゆび', 6: 'みぎての なかゆび', 7: 'みぎての くすりゆび', 8: 'みぎての こゆび' };
  const keyEls = {};
  KB_ROWS.forEach((row) => {
    const r = document.createElement('div');
    r.className = 'r';
    row.split('').forEach((ch) => {
      const k = document.createElement('div');
      k.className = 'k' + (ch === 'f' || ch === 'j' ? ' home' : '');
      k.textContent = ch;
      k.style.setProperty('--fc', 'var(--f' + FINGER_OF[ch] + ')');
      r.appendChild(k);
      keyEls[ch] = k;
    });
    ui.kb.appendChild(r);
  });

  // 左右の手の絵（キーボードに手をのせて、上から見た形）。キーボードの下に大きく出す
  // 指の色はキーの下の色とそろえる。押す指は その色で光り、指先に押すキーの文字が出る
  // 左手（左から）：こゆび(1)・くすりゆび(2)・なかゆび(3)・ひとさしゆび(4)、おやゆびは右下からスペースキーの方へ
  // 右手は左手を左右反対にした形：ひとさしゆび(5)・なかゆび(6)・くすりゆび(7)・こゆび(8)
  // [指の中心x, 指先のy, 根元のy, 太さ, 外へ開く角度]（左手。なかゆびが いちばん長く、こゆびが いちばん短い）
  const HAND_FINGERS = [
    [26, 32, 100, 19, -8],
    [46.5, 12, 98, 20, -3],
    [67, 4, 98, 20, 1],
    [87.5, 14, 100, 20, 6],
  ];
  function handSVG(side) {
    const fingers = side === 'L' ? [1, 2, 3, 4] : [5, 6, 7, 8].reverse();
    const flip = side === 'R' ? ' transform="translate(160 0) scale(-1 1)"' : '';
    let s = '<svg viewBox="0 0 160 158" width="134" height="132" role="img"><g' + flip + '>';
    // おやゆび：手のひらの内がわの下のほうから、ななめ上（約30度）へ。根元は手のひらの下にかくす
    s += '<rect class="thumb" x="108" y="62" width="21" height="58" rx="10.5" transform="rotate(32 118 118)"/>';
    HAND_FINGERS.forEach(([cx, top, base, w, deg], i) => {
      const f = fingers[i];
      s += '<g class="fg" data-f="' + f + '" style="--c: var(--f' + f + ')" transform="rotate(' + deg + ' ' + cx + ' ' + base + ')">' +
        '<rect x="' + (cx - w / 2) + '" y="' + top + '" width="' + w + '" height="' + (base - top + 14) + '" rx="' + (w / 2) + '"/>' +
        '<rect class="nail" x="' + (cx - w / 2 + 4) + '" y="' + (top + 4) + '" width="' + (w - 8) + '" height="9" rx="3"/>' +
        '<text x="' + cx + '" y="' + (top + 28) + '"' + (side === 'R' ? ' transform="translate(' + (2 * cx) + ' 0) scale(-1 1)"' : '') + '></text>' +
        '</g>';
    });
    // 手のひら（指の根元にかぶせて、ひとつながりの手に見せる）
    s += '<path class="palm" d="M15 102 C13 90 19 86 30 86 L100 86 C111 86 115 92 114 104 C113 126 104 146 80 152 L46 152 C26 148 17 128 15 102 Z"/>';
    return s + '</g></svg>';
  }
  $('handL').insertAdjacentHTML('afterbegin', handSVG('L'));
  $('handR').insertAdjacentHTML('afterbegin', handSVG('R'));
  const fingerEls = {};
  document.querySelectorAll('.hand .fg').forEach((el) => { fingerEls[el.dataset.f] = el; });
  function lightFinger(f, keyName) {
    Object.keys(fingerEls).forEach((k) => {
      const on = +k === f;
      fingerEls[k].classList.toggle('on', on);
      fingerEls[k].querySelector('text').textContent = on ? (keyName || '').toUpperCase() : '';
    });
  }

  // =========================================================
  //  ゲームの状態
  // =========================================================
  let m = null;               // 試合 or フリーバッティング（match.js）
  let phase = 'splash';       // 最初は「スタート」の画面（音はキーかクリックのあとでないと鳴らせないため）
  let pt = 0;                 // いまの場面に入ってからの秒
  let word = null, typer = null, limit = 1, pitchTime = 0, pitch = null;
  let result = null, reason = '', applied = null, flight = null, contact = null, missesNow = 0;
  let flightTime = 0.6, pitchTo = null; // 投げた球が着くまでの時間と、着く場所
  let rush = null;            // れんぞくの打席 { time, T, keys, words, misses, lastTick }
  let cpuRuns = 0, nameBuf = '', lastRank = null, saveFailed = false;
  let gameNo = 0;             // ゲームごとの番号（前のゲームの花火が次のゲームに出ないように）
  let bag = [];
  let parts = [];             // 花火・火花
  const stats = { keys: 0, misses: 0, typeTime: 0, missKeys: {}, pa: 0 };

  // 右投げのピッチャー。カーブは右打者から にげる（右へ）、シュートは 食いこむ（左へ）
  // arc = 山なり、dx = 横の曲がり、drop = 打者の手前で すとんと落ちる量、kmh = 球の速さ（遅い球は 何km か下げる）
  const PITCHES = [
    { id: 'straight', name: 'ストレート', w: 4, arc: 3, dx: 0, drop: 0, kmh: 0 },
    { id: 'curve', name: 'カーブ', w: 2, arc: 9, dx: 8, drop: 0, kmh: -25 },
    { id: 'shoot', name: 'シュート', w: 2, arc: 3, dx: -7, drop: 0, kmh: -5 },
    { id: 'fork', name: 'フォーク', w: 1, arc: 3, dx: 0, drop: 9, kmh: -12 },
    { id: 'slow', name: 'スローボール', w: 1, arc: 16, dx: 0, drop: 0, kmh: -45 },
  ];
  function pickPitch() {
    let r = Math.random() * PITCHES.reduce((s, p) => s + p.w, 0);
    for (const p of PITCHES) { r -= p.w; if (r < 0) return p; }
    return PITCHES[0];
  }

  function nextWord() {
    if (bag.length === 0) {
      bag = WORDS[settings.level].slice();
      for (let i = bag.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [bag[i], bag[j]] = [bag[j], bag[i]]; }
    }
